---
suite: "mozcloud: Reloader annotation"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/reloader-configuration.yaml
templates:
  - workload/deployment.yaml
  - workload/statefulset.yaml
  - workload/rollout.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: reloader.enabled annotates Deployment and StatefulSet, not their pod templates
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
        template: workload/deployment.yaml
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-deployment
      - notExists:
          path: spec.template.metadata.annotations["reloader.stakater.com/auto"]
        template: workload/deployment.yaml
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-deployment
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
        template: workload/statefulset.yaml
        documentSelector:
          path: $[?(@.kind == "StatefulSet")].metadata.name
          value: test-statefulset

  - it: Rollout is not annotated, since Reloader cannot act on it without isArgoRollouts
    asserts:
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: workload/rollout.yaml
        documentSelector:
          path: $[?(@.kind == "Rollout")].metadata.name
          value: test-rollout

  - it: A workload can override the chart-wide default, via its own annotation or reloader.enabled
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "false"
        template: workload/deployment.yaml
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-opt-out-annotation
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: workload/deployment.yaml
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-opt-out-field

  - it: A workload's reloader.enabled can also opt in when the chart-wide default is off
    set:
      reloader.enabled: false
      workloads.test-deployment.reloader.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
        template: workload/deployment.yaml
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-deployment
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: workload/statefulset.yaml
        documentSelector:
          path: $[?(@.kind == "StatefulSet")].metadata.name
          value: test-statefulset

  - it: Disabled by default, no annotation is added to Deployment or StatefulSet
    set:
      reloader.enabled: false
    asserts:
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: workload/deployment.yaml
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-deployment
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: workload/statefulset.yaml
        documentSelector:
          path: $[?(@.kind == "StatefulSet")].metadata.name
          value: test-statefulset
