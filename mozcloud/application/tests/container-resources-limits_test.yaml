---
suite: "mozcloud: Container resources explicit limits"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/container-resources-limits.yaml
templates:
  - workload/deployment.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Container with explicit limits uses them verbatim
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.requests.memory
          value: "150Mi"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.limits.cpu
          value: "1000m"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.limits.memory
          value: "256Mi"

  - it: Container without a cpu or memory limits override falls back to auto-doubled limits
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.requests.cpu
          value: "50m"
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.requests.memory
          value: "128Mi"
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.limits.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.limits.memory
          value: "256Mi"

  - it: Extended resource request is mirrored onto limits, not doubled
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      # Kubernetes rejects an extended resource whose request and limit differ,
      # so doubling it the way cpu and memory are doubled would be invalid.
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.requests['nvidia.com/gpu']
          value: "1"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.limits['nvidia.com/gpu']
          value: "1"
      # The cpu and memory limits from the base fixture are untouched by it.
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.limits.cpu
          value: "1000m"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].resources.limits.memory
          value: "256Mi"

  - it: Extended resource set on limits alone stays there, cpu and memory still double
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.limits['nvidia.com/gpu']
          value: 2
      # No request is derived for it in the pod spec; Kubernetes does that.
      - notExists:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.requests['nvidia.com/gpu']
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.limits.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[?(@.name=="sidecar")].resources.limits.memory
          value: "256Mi"

  - it: Extended resource key that is not domain-qualified is rejected
    values:
      - values/globals.yaml
      - values/container-resources-rejects-unqualified-extended-resource.yaml
    asserts:
      - failedTemplate:
          errorPattern: "nvidia-gpu"
