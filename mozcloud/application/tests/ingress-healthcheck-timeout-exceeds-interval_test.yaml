---
suite: "mozcloud: Ingress host is not validated for timeoutSec above checkIntervalSec"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/ingress-healthcheck-timeout-exceeds-interval.yaml
# The backend templates are listed so a failure raised while building the
# shared backends config (which also walks Ingress hosts) is caught.
templates:
  - gke/backend.yaml
  - gateway/backend.yaml
  - gke/ingress.yaml
  - ingress/ingress.yaml
tests:
  - it: Configuration matches snapshot and forwards both values unchanged
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}
      - equal:
          path: spec.healthCheck.checkIntervalSec
          value: 6
        template: gke/ingress.yaml
        documentSelector:
          path: $[?(@.kind == "BackendConfig")].metadata.name
          value: test-service
      - equal:
          path: spec.healthCheck.timeoutSec
          value: 10
        template: gke/ingress.yaml
        documentSelector:
          path: $[?(@.kind == "BackendConfig")].metadata.name
          value: test-service
