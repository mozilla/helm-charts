---
suite: "mozcloud: Ingress health check rejects timeoutSec above checkIntervalSec"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
chart:
  version: 1.0.0
values:
  - values/globals.yaml
templates:
  - ingress/ingress.yaml
tests:
  - it: Fails when a default backend's host sets timeoutSec above checkIntervalSec
    values:
      - values/ingress-healthcheck-timeout-exceeds-interval.yaml
    asserts:
      - failedTemplate:
          errorPattern: "hosts.test-service backend \"test-service\": options.healthCheck.timeoutSec \\(10\\) must be less than or equal to checkIntervalSec \\(6\\)"

  - it: Fails when the host interval and the backend timeout only conflict once merged
    values:
      - values/ingress-healthcheck-timeout-exceeds-interval-cross-level.yaml
    asserts:
      - failedTemplate:
          errorPattern: "hosts.test-service backend \"test-backend\": options.healthCheck.timeoutSec \\(10\\)"

  - it: Fails when timeoutSec is set without checkIntervalSec and exceeds the GKE default
    values:
      - values/ingress-healthcheck-timeout-exceeds-interval-timeout-only.yaml
    asserts:
      - failedTemplate:
          errorPattern: "hosts.test-service backend \"test-service\": options.healthCheck.timeoutSec \\(10\\) must be less than or equal to checkIntervalSec \\(5, the GKE default when unset\\)"
