---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # logSampleRate 0 means "log nothing". It is a legitimate value on both
      # APIs (the BackendConfig and GCPBackendPolicy CRDs both allow a sample
      # rate of 0), so it has to survive as 0 rather than being treated as
      # unset and falling back to the library default of 10%.
      ingress-host:
        domains:
          - ingress-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          logSampleRate: 50
        backends:
          inherits:
            path: /
          silenced:
            path: /quiet
            pathType: Exact
            service:
              name: silenced
            options:
              logSampleRate: 0

      gateway-host:
        domains:
          - gateway-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          logSampleRate: 0
