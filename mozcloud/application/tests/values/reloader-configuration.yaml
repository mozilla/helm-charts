---
# Deployment, StatefulSet, and Rollout workloads plus a per-workload override,
# used to verify the chart-wide reloader.enabled toggle
# (templates/workload/_helpers.tpl: mozcloud.workload.reloaderAnnotation)
# reaches every workload type and can still be overridden per workload.
reloader:
  enabled: true

workloads:
  test-deployment:
    component: web
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: "1.0.0"
  test-statefulset:
    component: db
    type: statefulset
    statefulSet:
      podManagementPolicy: Parallel
    containers:
      app:
        image:
          repository: test-repo/test-db
          tag: "1.0.0"
  test-rollout:
    component: web
    type: rollout
    strategy:
      canary:
        steps:
          - setWeight: 20
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: "1.0.0"
  test-opt-out:
    component: web
    annotations:
      reloader.stakater.com/auto: "false"
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: "1.0.0"
