---
# Reproduces the legacy autopush pattern: a privileged root init container that
# writes UNSAFE sysctls with `sysctl -w`, alongside a restricted app container.
# Needed where the target node pool's kubelet does not list those sysctls in
# --allowed-unsafe-sysctls, which makes the declarative
# workloads.<name>.security.sysctls path fail with SysctlForbidden.
workloads:
  test-service:
    component: web
    initContainers:
      sysctl:
        image:
          repository: alpine
          tag: "3"
        command:
          - /bin/sh
          - -c
          - sysctl -w net.ipv4.tcp_max_syn_backlog=65000;
        security:
          privileged: true
          user: 0
          group: 0
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
        security:
          user: 11000
          group: 12000
    security:
      # Required so the kubelet admits the root init container above.
      runAsRoot: true
      sysctls:
        - name: net.ipv4.ip_local_port_range
          value: "2000 65000"
