---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Gateway host where one backend suppresses its inherited
      # HealthCheckPolicy entirely rather than overriding individual options.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
            oauth2ClientId: my-client-id
            oauth2ClientSecret: my-client-secret
          securityPolicy: host-policy
          timeoutSec: 120
          logSampleRate: 50
        backends:
          app:
            service:
              port: 8080
          app-webhook:
            service:
              name: app-webhook
              port: 8080
            # Opt out of the HealthCheckPolicy this backend would otherwise
            # inherit from the host options.
            healthCheck:
              enabled: false
