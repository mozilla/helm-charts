---
workloads:
  additional-ports-svc:
    component: db
    type: statefulset
    strategy: RollingUpdate
    nginx:
      enabled: false
    statefulSet:
      podManagementPolicy: Parallel
    containers:
      app:
        image:
          repository: test-repo/test-db
          tag: "1.0.0"
        port: 8080
        additionalPorts:
          - name: metrics
            port: 9090
