---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Misconfiguration: two backends resolve to the same Service but declare
      # different IAP postures. The chart must fail the render rather than let
      # GKE silently bind both paths to a single BackendConfig.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
          securityPolicy: host-policy
          timeoutSec: 120
        backends:
          app:
            path: /
          app-webhook:
            path: /bugzilla_webhook
            pathType: Exact
            # Points at the protected backend's Service. Both backends would
            # then resolve to a single cloud.google.com/backend-config
            # annotation, so GKE would apply one IAP posture to both paths.
            service:
              name: app
            options:
              iap:
                enabled: false
              timeoutSec: 300
