---
workloads:
  test-service:
    component: web
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
        envFromFields:
          MY_NODE_NAME: spec.nodeName
          MY_POD_IP: status.podIP
          MY_POD_NAME: metadata.name
tasks:
  common:
    container:
      envFromFields:
        MY_COMMON_NODE: spec.nodeName
  jobs:
    test-job:
      type: preDeployment
      otel:
        containers:
          - app
      containers:
        app:
          image:
            repository: test-repo/test-image
            tag: 1.0.0
          command: ["/bin/sh", "-c"]
          args: ["true"]
          envVars:
            PLAIN_VAR: plain-value
          envFromFields:
            MY_POD_NAME: metadata.name
  cronJobs:
    test-cronjob:
      schedule: "0 0 * * *"
      jobConfig:
        containers:
          app:
            image:
              repository: test-repo/test-image
              tag: 1.0.0
            command: ["/bin/sh", "-c"]
            args: ["true"]
            envFromFields:
              MY_POD_IP: status.podIP
