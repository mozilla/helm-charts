---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # IAP enabled without a custom OAuth client. Google-managed OAuth is the
      # documented default when neither oauth2ClientId nor oauth2ClientSecret
      # is supplied.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
