---
workloads:
  test-service:
    component: web
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
        security:
          user: 11000
          group: 12000
          addCapabilities: ["NET_BIND_SERVICE"]
    security:
      user: 13000
      group: 14000
      runAsRoot: true
      fsGroup: 15000
      fsGroupChangePolicy: OnRootMismatch
      sysctls:
        - name: net.ipv4.ip_local_port_range
          value: "2000 65000"
        - name: net.core.somaxconn
          value: "16384"
