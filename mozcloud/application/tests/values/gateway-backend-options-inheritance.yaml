---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Gateway host protected by IAP with a single machine-called backend
      # exempted. Every explicit backend inherits the host's options and may
      # override them individually through its own options block.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
            oauth2ClientId: my-client-id
            oauth2ClientSecret: my-client-secret
          securityPolicy: host-policy
          timeoutSec: 120
          logSampleRate: 50
        backends:
          app:
            service:
              port: 8080
          app-webhook:
            service:
              name: app-webhook
              port: 8080
            options:
              iap:
                enabled: false
