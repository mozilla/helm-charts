---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Host protected by IAP with a custom OAuth client and one machine-called
      # backend exempted. Every explicit backend inherits the host's options
      # and may override them individually through its own options block.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
            oauth2ClientId: my-client-id
            oauth2ClientSecret: my-client-secret
          securityPolicy: host-policy
          timeoutSec: 120
          logSampleRate: 50
        backends:
          app:
            service:
              port: 8080
          app-webhook:
            service:
              name: app-webhook
              port: 8080
            options:
              iap:
                enabled: false

      # The inverse: the host leaves IAP off and a single backend opts in.
      optin-host:
        domains:
          - optin-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: false
        backends:
          optin-open:
            service:
              port: 8080
          optin-protected:
            service:
              name: optin-protected
              port: 8080
            options:
              iap:
                enabled: true

      # IAP without a custom OAuth client. Google-managed OAuth is the
      # documented default when neither oauth2ClientId nor oauth2ClientSecret
      # is supplied, and both CRD fields are string-typed, so they must be
      # omitted rather than emitted empty.
      google-oauth-host:
        domains:
          - google-oauth-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
        backends:
          google-oauth:
            service:
              port: 8080

      # Backends opting out of the policies they would otherwise inherit from
      # the host options.
      opt-out-host:
        domains:
          - opt-out-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        backends:
          opt-out-full:
            service:
              port: 8080
          opt-out-no-policy:
            service:
              name: opt-out-no-policy
              port: 8080
            backendPolicy:
              enabled: false
          opt-out-no-healthcheck:
            service:
              name: opt-out-no-healthcheck
              port: 8080
            healthCheck:
              enabled: false

      # logSampleRate 0 means "log nothing" and has to survive as 0 rather than
      # falling back to the library default of 10%.
      log-sample-host:
        domains:
          - log-sample-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          logSampleRate: 0
        backends:
          silenced-gateway:
            service:
              port: 8080
