---
workloads:
  test-service:
    component: web
    containers: {}
    hosts:
      header-only:
        domains: ["header.only"]
        httpRoutes:
          rules:
            - matches:
                - headers:
                    - name: foo
                      value: bar
      path-only:
        domains: ["path.only"]
        httpRoutes:
          rules:
            - matches:
                - path:
                    value: /foo
                    type: PathPrefix
      headers-and-path:
        domains: ["headers.and.path"]
        httpRoutes:
          rules:
            - matches:
                - path:
                    value: /foo
                    type: PathPrefix
                  headers:
                    - name: foo
                      value: bar
                    - name: baz
                      value: qux
      backendref-filters:
        domains: ["backendref.filters"]
        httpRoutes:
          rules:
            - backendRefs:
                - name: test-service
                  port: 8080
                  weight: 100
                  filters:
                    - type: ResponseHeaderModifier
                      responseHeaderModifier:
                        set:
                          - name: X-Canary
                            value: stable
                - name: test-service-canary
                  port: 8080
                  weight: 0
                  filters:
                    - type: ResponseHeaderModifier
                      responseHeaderModifier:
                        set:
                          - name: X-Canary
                            value: canary
