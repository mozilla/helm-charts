---
workloads:
  test-service:
    component: web
    containers: {}
    hosts:
      header-only:
        domains: ["header.only"]
        httpRoutes:
          rules:
            - matches:
                - headers:
                    - name: foo
                      value: bar
      path-only:
        domains: ["path.only"]
        httpRoutes:
          rules:
            - matches:
                - path:
                    value: /foo
                    type: PathPrefix
      headers-and-path:
        domains: ["headers.and.path"]
        httpRoutes:
          rules:
            - matches:
                - path:
                    value: /foo
                    type: PathPrefix
                  headers:
                    - name: foo
                      value: bar
                    - name: baz
                      value: qux
      redirect-filter:
        domains: ["redirect.filter"]
        httpRoutes:
          rules:
            - matches:
                - path:
                    value: /old
                    type: PathPrefix
              filters:
                - type: RequestRedirect
                  requestRedirect:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /new
                    statusCode: 301
      rule-filters:
        domains: ["rule.filters"]
        httpRoutes:
          rules:
            - matches:
                - path:
                    value: /foo
                    type: PathPrefix
              filters:
                - type: RequestMirror
                  requestMirror:
                    backendRef:
                      kind: Service
                      name: test-service-shadow
                      port: 8080
                - type: ResponseHeaderModifier
                  responseHeaderModifier:
                    set:
                      - name: X-Shadowed
                        value: "true"
