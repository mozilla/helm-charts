---
workloads:
  test-service:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      test-service:
        domains:
          - test-service.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        # The interval lives on the host and the timeout on the backend, so
        # only the resolved values show the mismatch.
        options:
          healthCheck:
            path: /__lbheartbeat__
            checkIntervalSec: 6
        backends:
          test-backend:
            service:
              port: 8080
            options:
              healthCheck:
                timeoutSec: 10
