---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Inverse of ingress-backend-iap-override: the host leaves IAP off and a
      # single backend opts into it. Proves the override works in both
      # directions, not just when relaxing the host default.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: false
          securityPolicy: host-policy
          timeoutSec: 120
        backends:
          app:
            path: /
          app-webhook:
            path: /bugzilla_webhook
            pathType: Exact
            service:
              name: app-webhook
            options:
              iap:
                enabled: true
              timeoutSec: 300
