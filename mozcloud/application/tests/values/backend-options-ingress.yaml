---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Host protected by IAP with one machine-called path exempted. IAP is
      # enforced per backend service, not per URL path, so the exempt path
      # needs its own Service: a Service carries one
      # cloud.google.com/backend-config annotation per port, and that
      # annotation is what binds it to a BackendConfig.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
          securityPolicy: host-policy
          timeoutSec: 120
        backends:
          app:
            path: /
          app-webhook:
            path: /bugzilla_webhook
            pathType: Exact
            service:
              name: app-webhook
            options:
              iap:
                enabled: false
              timeoutSec: 300

      # The inverse: the host leaves IAP off and a single backend opts in.
      # Proves the override works in both directions, not only when relaxing
      # the host default.
      optin-host:
        domains:
          - optin-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: false
        backends:
          optin-open:
            path: /
          optin-protected:
            path: /admin
            pathType: Exact
            service:
              name: optin-protected
            options:
              iap:
                enabled: true

      # Two backends deliberately share one Service. Permitted because their
      # IAP postures agree, so the single backend-config annotation is
      # unambiguous.
      shared-service-host:
        domains:
          - shared-service-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
        backends:
          shared-root:
            path: /
            service:
              name: shared-service
          shared-api:
            path: /api
            service:
              name: shared-service

      # logSampleRate 0 means "log nothing". It is a legitimate value that has
      # to survive as 0 rather than being treated as unset and falling back to
      # the library default of 10%.
      log-sample-host:
        domains:
          - log-sample-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          logSampleRate: 50
        backends:
          logged:
            path: /
          silenced:
            path: /quiet
            pathType: Exact
            service:
              name: silenced
            options:
              logSampleRate: 0
