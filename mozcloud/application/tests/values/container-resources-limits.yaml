---
workloads:
  test-service:
    component: web
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: "1.0.0"
        resources:
          cpu: 100m
          memory: 150Mi
          # Requested on its own: should be mirrored onto limits, not doubled
          nvidia.com/gpu: "1"
          limits:
            cpu: 1000m
            memory: 256Mi
      sidecar:
        image:
          repository: test-repo/test-sidecar
          tag: "1.0.0"
        resources:
          # No cpu/memory limits override: should auto-double to 100m/256Mi
          cpu: 50m
          memory: 128Mi
          limits:
            # Pinned on limits alone, as a bare integer, which is the usual way
            # to claim a device plugin resource
            nvidia.com/gpu: 2
