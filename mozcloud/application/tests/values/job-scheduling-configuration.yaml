---
# Overlay applied on top of values/basic-job-configuration.yaml. It configures
# the pod scheduling fields on test-predeployment-job and deliberately leaves
# test-postdeployment-job untouched: the second job is what pins the gates, an
# unconditional render would show up on it.
tasks:
  jobs:
    test-predeployment-job:
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: test-chart
