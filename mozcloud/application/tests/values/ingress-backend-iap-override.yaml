---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Ingress host protected by IAP with a single machine-called path
      # exempted. IAP is enforced per backend service, not per URL path, so the
      # exempt path needs its own Service: a Service carries one
      # cloud.google.com/backend-config annotation per port, and that
      # annotation is what binds it to a BackendConfig.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
          securityPolicy: host-policy
          timeoutSec: 120
        backends:
          app:
            path: /
          app-webhook:
            path: /bugzilla_webhook
            pathType: Exact
            service:
              name: app-webhook
            options:
              iap:
                enabled: false
              timeoutSec: 300
