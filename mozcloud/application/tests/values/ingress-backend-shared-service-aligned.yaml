---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Two backends deliberately share one Service. Permitted because their
      # IAP postures agree, so the single backend-config annotation is
      # unambiguous.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: true
          securityPolicy: host-policy
          timeoutSec: 120
        backends:
          app:
            path: /
          app-webhook:
            path: /bugzilla_webhook
            pathType: Exact
            # Shares the protected backend's Service. Allowed because both
            # backends agree on their IAP posture.
            service:
              name: app
            options:
              iap:
                enabled: true
              timeoutSec: 300
