---
workloads:
  test-service:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      test-service:
        domains:
          - test-service.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: ingress
        tls:
          type: ManagedCertificate
          create: true
        # Not enforced on the Ingress API; only Gateway hosts are validated.
        options:
          healthCheck:
            requestPath: /__lbheartbeat__
            checkIntervalSec: 6
            timeoutSec: 10
