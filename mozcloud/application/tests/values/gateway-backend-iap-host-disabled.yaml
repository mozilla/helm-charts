---
workloads:
  my-app:
    component: app
    containers:
      app:
        image:
          repository: test-repo/test-image
          tag: 1.0.0
    hosts:
      # Inverse of gateway-backend-options-inheritance: the host leaves IAP off
      # and a single backend opts into it. Proves the override works in both
      # directions, not just when relaxing the host default.
      iap-host:
        domains:
          - iap-host.dev.test-domain.com
        addresses:
          - mozcloud-dev-ip-v4
        api: gateway
        tls:
          type: ManagedCertificate
          create: true
        options:
          iap:
            enabled: false
            oauth2ClientId: my-client-id
            oauth2ClientSecret: my-client-secret
          securityPolicy: host-policy
          timeoutSec: 120
          logSampleRate: 50
        backends:
          app:
            service:
              port: 8080
          app-webhook:
            service:
              name: app-webhook
              port: 8080
            options:
              iap:
                enabled: true
