---
# Overlay on backend-options-ingress.yaml. Gives the IAP host an OAuth client ID
# but no Secret. The Ingress BackendConfig reads the client from the Secret, so
# the chart must fail rather than silently fall back to the Google-managed
# client.
workloads:
  my-app:
    hosts:
      iap-host:
        options:
          iap:
            oauth2ClientId: my-client-id
