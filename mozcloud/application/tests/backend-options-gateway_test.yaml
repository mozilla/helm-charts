---
suite: "mozcloud: Gateway per-backend options"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/backend-options-gateway.yaml
templates:
  - gke/backend.yaml
  - gateway/backend.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Backends inherit every host option and override them individually
    template: gke/backend.yaml
    asserts:
      - equal:
          path: spec.default.iap.enabled
          value: true
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - equal:
          path: spec.default.iap.clientID
          value: my-client-id
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - equal:
          path: spec.default.iap.oauth2ClientSecret.name
          value: my-client-secret
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - equal:
          path: spec.default.securityPolicy
          value: host-policy
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - equal:
          path: spec.default.timeoutSec
          value: 120
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - equal:
          path: spec.default.logging.sampleRate
          value: 500000
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      # An exempt backend omits the iap block entirely but keeps everything
      # else it inherited from the host.
      - notExists:
          path: spec.default.iap
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app-webhook
      - equal:
          path: spec.default.securityPolicy
          value: host-policy
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app-webhook
      - equal:
          path: spec.default.timeoutSec
          value: 120
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app-webhook

  - it: A backend can opt into IAP when the host leaves it off
    template: gke/backend.yaml
    asserts:
      - notExists:
          path: spec.default.iap
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: optin-open
      - equal:
          path: spec.default.iap.enabled
          value: true
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: optin-protected

  - it: IAP without a custom OAuth client omits the client fields
    template: gke/backend.yaml
    documentSelector:
      path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
      value: google-oauth
    asserts:
      - equal:
          path: spec.default.iap.enabled
          value: true
      # clientID and oauth2ClientSecret.name are string-typed on the CRD.
      # Emitting them with no value renders nulls and the API server rejects
      # the resource, so they must be omitted when relying on Google-managed
      # OAuth.
      - notExists:
          path: spec.default.iap.clientID
      - notExists:
          path: spec.default.iap.oauth2ClientSecret

  - it: Every explicit backend gets a GCPBackendPolicy and a HealthCheckPolicy
    template: gke/backend.yaml
    asserts:
      # Regression guard: explicit backends used to render neither policy, so a
      # host's Cloud Armor policy, timeout and IAP settings were dropped as
      # soon as the tenant declared backends.
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: opt-out-full
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: opt-out-full

  - it: enabled false suppresses an inherited policy
    template: gke/backend.yaml
    asserts:
      - containsDocument:
          kind: GCPBackendPolicy
          apiVersion: networking.gke.io/v1
          name: opt-out-no-policy
        not: true
      # The backend still gets its health check; only the policy opted out.
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: opt-out-no-policy
      - containsDocument:
          kind: HealthCheckPolicy
          apiVersion: networking.gke.io/v1
          name: opt-out-no-healthcheck
        not: true
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: opt-out-no-healthcheck

  - it: A logSampleRate of zero disables access logging instead of being dropped
    template: gke/backend.yaml
    documentSelector:
      path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
      value: silenced-gateway
    asserts:
      - equal:
          path: spec.default.logging.sampleRate
          value: 0

  - it: Schema rejects a timeoutSec of zero
    # Kept as a `set` because the point of the test is an out-of-range value
    # that should never appear in a values file. GCP requires a backend timeout
    # of at least 1 second and the GCPBackendPolicy CRD enforces minimum: 1.
    set:
      workloads.my-app.hosts.iap-host.options.timeoutSec: 0
    asserts:
      - failedTemplate:
          errorPattern: "timeoutSec.*minimum"
