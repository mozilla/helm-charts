---
suite: "mozcloud: Basic job configuration"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/basic-job-configuration.yaml
templates:
  - task/job.yaml
  - gke/podmonitoring.yaml
tests:
  - it: PodMonitoring should not render when no workloads are defined
    template: gke/podmonitoring.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Pre- and post-deployment Jobs are configured correctly
    template: task/job.yaml
    asserts:
      # Pre-deployment job is configured correctly
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.backoffLimit
          value: 6
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.parallelism
          value: 1
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-repo/test-predeployment-job-image:2.0.0
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["sh", "-c"]
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["echo", "running", "before", "deployment"]
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.template.spec.containers[0].name
          value: job
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - exists:
          path: spec.template.spec.containers[0].resources
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - isSubset:
          path: spec.template.spec.containers[0].resources
          content:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - exists:
          path: spec.template.spec.containers[0].securityContext
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - isSubset:
          path: spec.template.spec.containers[0].securityContext
          content:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - exists:
          path: spec.template.spec.securityContext
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - isSubset:
          path: spec.template.spec.securityContext
          content:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # Post-deployment job is configured correctly
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.backoffLimit
          value: 6
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.parallelism
          value: 1
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.template.spec.containers[0].image
          value: test-repo/test-postdeployment-job-image:3.0.0
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["sh", "-c"]
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["echo", "running", "after", "deployment"]
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.template.spec.containers[0].name
          value: job
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - exists:
          path: spec.template.spec.containers[0].resources
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - isSubset:
          path: spec.template.spec.containers[0].resources
          content:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - exists:
          path: spec.template.spec.containers[0].securityContext
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - isSubset:
          path: spec.template.spec.containers[0].securityContext
          content:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - exists:
          path: spec.template.spec.securityContext
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - isSubset:
          path: spec.template.spec.securityContext
          content:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job

  - it: Job renders pod scheduling fields only when they are configured
    template: task/job.yaml
    values:
      - values/globals.yaml
      - values/basic-job-configuration.yaml
      - values/job-scheduling-configuration.yaml
    asserts:
      # The scheduling fields share one gate style, so they are asserted
      # together. topologySpreadConstraints was schema-declared and documented
      # long before the template rendered it, which is what this covers.
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: test-chart
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - isSubset:
          path: spec.template.spec.nodeSelector
          content:
            disktype: ssd
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # The other job in the fixture configures none of them, which pins the
      # gates: an unconditional render would show up here rather than only in
      # the suite snapshot.
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - notExists:
          path: spec.template.spec.nodeSelector
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - notExists:
          path: spec.template.spec.tolerations
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job

  - it: Job labels reach the pods, annotations stay on the Job
    template: task/job.yaml
    values:
      - values/globals.yaml
      - values/basic-job-configuration.yaml
      - values/job-labels-annotations-configuration.yaml
    asserts:
      - equal:
          path: metadata.labels.team
          value: mozcloud
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: spec.template.metadata.labels.team
          value: mozcloud
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: mozcloud
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # Annotations stop at the Job. The pod template is built by
      # _jobTemplate.yaml, which only emits the generated OTEL annotations, so
      # the asymmetry with labels above is deliberate rather than an oversight.
      - notExists:
          path: spec.template.metadata.annotations["example.com/owner"]
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # The unconfigured job in the same render pins that nothing leaks across.
      - notExists:
          path: metadata.labels.team
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job

  - it: Job annotations take precedence over the generated ArgoCD annotations
    template: task/job.yaml
    values:
      - values/globals.yaml
      - values/basic-job-configuration.yaml
      - values/job-labels-annotations-configuration.yaml
    asserts:
      # The chart derives -1 for a pre-deployment job; the caller's value has to
      # win, otherwise the override would be silently dropped.
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-5"
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # Keys the caller does not set survive the merge untouched.
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job

  - it: Labels and annotations deep-merge across common, default, and the job
    template: task/job.yaml
    values:
      - values/globals.yaml
      - values/basic-job-configuration.yaml
      - values/job-labels-annotations-layers.yaml
    asserts:
      # Every layer contributes its own keys; none of them replaces another
      # wholesale.
      - isSubset:
          path: metadata.labels
          content:
            only-common: "1"
            only-default: "1"
            only-job: "1"
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - isSubset:
          path: metadata.annotations
          content:
            aonly-common: "1"
            aonly-default: "1"
            aonly-job: "1"
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # On a contested key the individual job wins.
      - equal:
          path: metadata.labels.layer
          value: from-job
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      - equal:
          path: metadata.annotations.alayer
          value: from-job
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-predeployment-job
      # Where the job stays silent, tasks.common.job wins over the protected
      # "default" key — the formatter merges common in as the override side and
      # the default key as the base, which is the opposite of what the naming
      # suggests.
      - equal:
          path: metadata.labels.layer
          value: from-common
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
      - equal:
          path: metadata.annotations.alayer
          value: from-common
        documentSelector:
          path: $[?(@.kind == "Job")].metadata.name
          value: test-postdeployment-job
