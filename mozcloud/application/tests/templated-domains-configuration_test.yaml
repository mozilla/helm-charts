---
suite: "mozcloud: Templated host domains"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/templated-domains-configuration.yaml
templates:
  - gateway/gateway.yaml
  - gateway/httproute.yaml
  - gke/ingress.yaml
  - ingress/ingress.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Templated domains are resolved on gateway and ingress resources
    asserts:
      # Gateway path: the templated domain is resolved and the literal domain
      # is passed through untouched.
      - equal:
          path: spec.hostnames
          value:
            - gateway.test-domain.com
            - literal-gateway.test-domain.com
            - gateway.mozcloud-test.mozcloud.example.com
            - env-app.example.com
            - region-prod.example.com
        template: gateway/httproute.yaml
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-gateway-service
      # Ingress path: domains reach the ingress library already resolved, so
      # the generated ManagedCertificate covers the real hostname.
      - contains:
          path: spec.domains
          content: ingress.test-domain.com
        template: gke/ingress.yaml
        documentSelector:
          path: $[?(@.kind == "ManagedCertificate")].metadata.name
          value: ingress-test-domain-com
      # The certificate name is derived from the resolved domain, confirming
      # resolution happens before the library consumes the domain list.
      - equal:
          path: metadata.annotations["networking.gke.io/managed-certificates"]
          value: ingress-test-domain-com
        template: ingress/ingress.yaml
        documentSelector:
          path: $[?(@.kind == "Ingress")].metadata.name
          value: test-ingress-service
