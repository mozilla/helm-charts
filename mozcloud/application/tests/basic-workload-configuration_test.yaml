---
suite: "mozcloud: Basic workload configuration"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/basic-configuration.yaml
templates:
  - configmap/configmap.yaml
  - externalsecret/externalsecret.yaml
  - gke/podmonitoring.yaml
  - serviceaccount/serviceaccount.yaml
  - workload/deployment.yaml
  - workload/hpa.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: ConfigMap is configured correctly
    template: configmap/configmap.yaml
    documentSelector:
      path: $[?(@.kind == "ConfigMap")].metadata.name
      value: test-configmap
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-11"
      - isSubset:
          path: data
          content:
            FOO: bar
            baz: "1"

  - it: ExternalSecret is configured correctly
    template: externalsecret/externalsecret.yaml
    documentSelector:
      path: $[?(@.kind == "ExternalSecret")].metadata.name
      value: test-chart-secrets
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-11"
      - contains:
          path: spec.dataFrom
          content:
            extract:
              conversionStrategy: Default
              decodingStrategy: None
              key: dev-gke-app-secrets
              metadataPolicy: None
              version: latest
      - equal:
          path: spec.refreshInterval
          value: 5m
      - isSubset:
          path: spec.secretStoreRef
          content:
            kind: SecretStore
            name: secret-store
      - equal:
          path: spec.target.name
          value: test-chart-secrets

  - it: ServiceAccount is configured correctly
    template: serviceaccount/serviceaccount.yaml
    documentSelector:
      path: $[?(@.kind == "ServiceAccount")].metadata.name
      value: mozcloud-test
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-11"
      - exists:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: gke-dev@moz-fx-mozcloud-test-nonprod.iam.gserviceaccount.com

  - it: Deployment pod spec and both containers are configured correctly
    template: workload/deployment.yaml
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      # Deployment (containers excluded) is configured correctly
      - exists:
          path: spec.selector.matchLabels
      - isNotNullOrEmpty:
          path: spec.selector.matchLabels
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - isSubset:
          path: spec.template.spec.securityContext
          content:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.serviceAccountName
          value: mozcloud-test
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 5
      - isSubset:
          path: spec.template.spec.volumes[0]
          content:
            configMap:
              name: test-service-nginx
            name: nginx-conf
      - isSubset:
          path: spec.template.spec.volumes[1]
          content:
            configMap:
              name: test-service-configmap
            name: test-service-configmap
      - isSubset:
          path: spec.template.spec.volumes[2]
          content:
            emptyDir: {}
            name: test-service-empty
      - isSubset:
          path: spec.template.spec.volumes[3]
          content:
            name: test-service-memory
            emptyDir:
              medium: Memory
              sizeLimit: 500Mi
      - isSubset:
          path: spec.template.spec.volumes[4]
          content:
            secret:
              secretName: test-service-secret
            name: test-service-secret
      # Deployment (app container) is configured correctly
      - contains:
          path: spec.template.spec.containers[1].envFrom
          content:
            secretRef:
              name: test-chart-secrets
      - equal:
          path: spec.template.spec.containers[1].image
          value: test-repo/test-image:1.0.0
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always
      - isSubset:
          path: spec.template.spec.containers[1].readinessProbe
          content:
            failureThreshold: 3
            httpGet:
              path: /__lbheartbeat__
              port: app
            initialDelaySeconds: 10
            periodSeconds: 6
            successThreshold: 1
            timeoutSeconds: 5
      - isSubset:
          path: spec.template.spec.containers[1].livenessProbe
          content:
            failureThreshold: 5
            httpGet:
              path: /__lbheartbeat__
              port: app
            initialDelaySeconds: 10
            periodSeconds: 6
            successThreshold: 1
            timeoutSeconds: 5
      - equal:
          path: spec.template.spec.containers[1].name
          value: app
      - lengthEqual:
          path: spec.template.spec.containers[1].ports
          count: 1
      - isSubset:
          path: spec.template.spec.containers[1].ports[0]
          content:
            containerPort: 8000
            name: app
      - isSubset:
          path: spec.template.spec.containers[1].resources
          content:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      - isSubset:
          path: spec.template.spec.containers[1].securityContext
          content:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      # Deployment (nginx container) is configured correctly
      - equal:
          path: spec.template.spec.containers[0].image
          value: us-west1-docker.pkg.dev/moz-fx-platform-artifacts/platform-shared-images/nginx-unprivileged:1.31
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - isSubset:
          path: spec.template.spec.containers[0].readinessProbe
          content:
            failureThreshold: 3
            httpGet:
              path: /__lbheartbeat__
              port: http
            initialDelaySeconds: 10
            periodSeconds: 6
            successThreshold: 1
            timeoutSeconds: 5
      - isSubset:
          path: spec.template.spec.containers[0].livenessProbe
          content:
            failureThreshold: 5
            httpGet:
              path: /__nginxheartbeat__
              port: http
            initialDelaySeconds: 10
            periodSeconds: 6
            successThreshold: 1
            timeoutSeconds: 5
      - equal:
          path: spec.template.spec.containers[0].name
          value: nginx
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - isSubset:
          path: spec.template.spec.containers[0].ports[0]
          content:
            containerPort: 8080
            name: http
            protocol: TCP
      - isSubset:
          path: spec.template.spec.containers[0].resources
          content:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      - isSubset:
          path: spec.template.spec.containers[0].securityContext
          content:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 101
            runAsUser: 101
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - isSubset:
          path: spec.template.spec.containers[0].volumeMounts[0]
          content:
            mountPath: /etc/nginx/nginx.conf
            name: nginx-conf
            readOnly: true
            subPath: nginx.conf
      # Exec probes render correctly and suppress httpGet
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/sh", "-c", "/usr/local/bin/healthcheck"]
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/sh", "-c", "/usr/local/bin/healthcheck"]
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec

  - it: NGINX sidecar ConfigMap is rendered with nginx.conf data
    template: workload/deployment.yaml
    documentSelector:
      path: $[?(@.kind == "ConfigMap")].metadata.name
      value: test-service-nginx
    asserts:
      - isNotNullOrEmpty:
          path: data["nginx.conf"]

  - it: HPA is configured correctly
    template: workload/hpa.yaml
    documentSelector:
      path: $[?(@.kind == "HorizontalPodAutoscaler")].metadata.name
      value: test-service
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 30
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 60
      - isSubset:
          path: spec.scaleTargetRef
          content:
            apiVersion: apps/v1
            kind: Deployment
            name: test-service

  - it: PodMonitoring is not rendered when telegraf is disabled by default
    template: gke/podmonitoring.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Schema rejects emptyDir with medium Memory but no sizeLimit
    template: workload/deployment.yaml
    set:
      workloads.test-service.containers.app.volumes:
        - name: bad-volume
          type: emptyDir
          path: /tmp/bad
          medium: Memory
    asserts:
      - failedTemplate:
          errorPattern: missing property 'sizeLimit'

  - it: Deployment emits revisionHistoryLimit only when set, explicit zero included
    template: workload/deployment.yaml
    set:
      workloads.test-service.revisionHistoryLimit: 3
      workloads.test-worker-exec.revisionHistoryLimit: 0
    asserts:
      # The field is opt-in. A default here would change the rendered manifest of
      # every existing workload using this chart. That case needs no case of its
      # own: the suite snapshot renders the fixture without the field and would
      # fail if it were ever emitted.
      - equal:
          path: spec.revisionHistoryLimit
          value: 3
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service
      # 0 keeps no revisions at all, so there is nothing left to roll back to.
      # That is a deliberate choice rather than "unset", which is why emission is
      # gated on the key being present rather than on truthiness.
      - exists:
          path: spec.revisionHistoryLimit
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      - equal:
          path: spec.revisionHistoryLimit
          value: 0
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec

  - it: Deployment emits a startupProbe only when enabled, httpGet and exec
    template: workload/deployment.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/startup-probe-configuration.yaml
    asserts:
      # Enabling the probe alone yields a usable 5 minute startup budget
      # (periodSeconds 10 * failureThreshold 30) against the container's own
      # primary port, without repeating the readiness configuration.
      - isSubset:
          path: spec.template.spec.containers[1].startupProbe
          content:
            failureThreshold: 30
            httpGet:
              path: /__lbheartbeat__
              port: app
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service
      # Kubernetes requires successThreshold to be 1 for startup probes, so the
      # field is not offered and must never be rendered.
      - notExists:
          path: spec.template.spec.containers[1].startupProbe.successThreshold
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service
      # The startup timings are independent of readiness. test-worker-exec sets
      # neither, so it keeps the startup defaults above while its readiness probe
      # continues to use the fixture's own values.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value: ["python", "warmup.py"]
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.httpGet
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      # The probe is opt-in, so the nginx sidecar — which is not configurable
      # through healthCheck — never gets one. The absent-by-default case needs no
      # case of its own: the suite snapshot renders both fixtures without the
      # field and would fail if it were ever emitted.
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service

  - it: Custom workload labels propagate to Deployment and Pod template
    template: workload/deployment.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/workload-labels-configuration.yaml
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      - equal:
          path: metadata.labels["registry.gke.io/functional-type"]
          value: AGENT
      - equal:
          path: spec.template.metadata.labels["registry.gke.io/functional-type"]
          value: AGENT

  - it: Custom workload labels cannot overwrite MozCloud-managed labels
    template: workload/deployment.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/protected-workload-labels-configuration.yaml
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      # mozcloud.labels always merges the MozCloud-managed values (from
      # global.mozcloud) on top of any user-provided base, so these keys
      # cannot be overridden through workloads.<name>.labels.
      - notEqual:
          path: metadata.labels.app_code
          value: hacked
      - notEqual:
          path: metadata.labels.env_code
          value: hacked

  - it: Custom workload annotations are accepted by the schema and applied to Deployment and Pod template
    template: workload/deployment.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/workload-annotations-configuration.yaml
    documentSelector:
      path: $[?(@.kind == "Deployment")].metadata.name
      value: test-service
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: metadata.annotations["iam.gke.io/spiffe-identity-type"]
          value: agent-identity
      - equal:
          path: spec.template.metadata.annotations["iam.gke.io/spiffe-identity-type"]
          value: agent-identity

  - it: Deployment emits rollingUpdate per key, absolute and percentage forms
    template: workload/deployment.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/deployment-rolling-update-configuration.yaml
    asserts:
      # The tuning is opt-in. The absent case needs no case of its own: the
      # suite snapshot renders both fixtures with strategy.type alone and would
      # fail if a rollingUpdate block were ever emitted.
      - isSubset:
          path: spec.strategy
          content:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service
      # 0 means "never drop below the desired count", a deliberate choice rather
      # than "unset", which is why each key is gated on presence instead of
      # truthiness.
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service
      # Kubernetes takes both fields as IntOrString, so the percentage form has
      # to survive as a string rather than being coerced to a number.
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: "25%"
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec
      # maxSurge alone must not pull in a default sibling: an unset
      # maxUnavailable stays with the Kubernetes default of 25%.
      - notExists:
          path: spec.strategy.rollingUpdate.maxUnavailable
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-worker-exec

  - it: Schema rejects rollingUpdate combined with the Recreate strategy
    template: workload/deployment.yaml
    set:
      workloads.test-service.strategy: Recreate
      workloads.test-service.deployment.rollingUpdate.maxSurge: 1
    asserts:
      # Kubernetes rejects the combination outright, so the chart must not
      # accept it and quietly render a Recreate deployment without the tuning.
      - failedTemplate:
          errorPattern: rollingUpdate

  - it: Recreate strategy validates against the empty rollingUpdate default
    template: workload/deployment.yaml
    set:
      workloads.default.strategy: Recreate
    asserts:
      # values.yaml documents the tuning as an empty rollingUpdate block under
      # workloads.default, so a chart-wide strategy: Recreate is validated with
      # that default in place. Constraining the block itself to null would fail
      # here on the chart's own value, leaving the tenant nothing to remove.
      - notFailedTemplate: {}
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service
      - notExists:
          path: spec.strategy.rollingUpdate
        documentSelector:
          path: $[?(@.kind == "Deployment")].metadata.name
          value: test-service

  - it: Schema rejects maxSurge and maxUnavailable both being zero
    template: workload/deployment.yaml
    set:
      workloads.test-service.deployment.rollingUpdate.maxSurge: 0
      workloads.test-service.deployment.rollingUpdate.maxUnavailable: 0
    asserts:
      # The pair leaves Kubernetes no room to either add or remove a pod, so the
      # API server rejects it on apply. Nothing earlier in the pipeline catches
      # it — kubeconform validates the structure only — so without this rule the
      # manifest renders clean and the rollout fails in the cluster.
      - failedTemplate:
          errorPattern: rollingUpdate

  - it: Schema rejects the percentage form of both fields being zero
    template: workload/deployment.yaml
    set:
      workloads.test-service.deployment.rollingUpdate.maxSurge: "0%"
      workloads.test-service.deployment.rollingUpdate.maxUnavailable: "0%"
    asserts:
      # Kubernetes resolves a percentage before comparing, so "0%" is the same
      # zero as 0 and has to be rejected in the same pairing.
      - failedTemplate:
          errorPattern: rollingUpdate
