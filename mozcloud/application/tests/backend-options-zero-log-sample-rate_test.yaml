---
suite: "mozcloud: logSampleRate of zero is preserved"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/backend-options-zero-log-sample-rate.yaml
templates:
  - gke/ingress.yaml
  - ingress/ingress.yaml
  - gke/backend.yaml
  - gateway/backend.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Ingress backend overriding logSampleRate to zero disables access logging
    template: gke/ingress.yaml
    asserts:
      # A truthiness guard would drop the 0 here and let the library default of
      # 10% apply, silently logging traffic the tenant asked not to log.
      - equal:
          path: spec.logging.sampleRate
          value: 0
        documentSelector:
          path: $[?(@.kind == "BackendConfig")].metadata.name
          value: silenced
      - equal:
          path: spec.logging.sampleRate
          value: 0.5
        documentSelector:
          path: $[?(@.kind == "BackendConfig")].metadata.name
          value: inherits

  - it: Gateway host logSampleRate of zero disables access logging
    template: gke/backend.yaml
    documentSelector:
      path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
      value: my-app
    asserts:
      - equal:
          path: spec.default.logging.sampleRate
          value: 0

  - it: Schema rejects a timeoutSec of zero
    # Kept as a `set` because the point of the test is an out-of-range value
    # that should never appear in a values file. GCP requires a backend timeout
    # of at least 1 second and the GCPBackendPolicy CRD enforces minimum: 1.
    set:
      workloads.my-app.hosts.ingress-host.options.timeoutSec: 0
    asserts:
      - failedTemplate:
          errorPattern: "timeoutSec.*minimum"
