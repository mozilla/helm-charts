---
suite: "mozcloud: HTTPRoute rules"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/httproute-rules.yaml
templates:
  - gateway/httproute.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Header-only, path-only, and headers-and-path HTTPRoutes render correct rules
    asserts:
      # Header-only HTTPRoute is configured with correct rules
      - contains:
          path: spec.rules[0].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: header-only
      - contains:
          path: spec.rules[0].matches
          content:
            headers:
              - name: foo
                value: bar
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: header-only
      # Path-only HTTPRoute is configured with correct rules
      - contains:
          path: spec.rules[0].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: path-only
      - contains:
          path: spec.rules[0].matches
          content:
            path:
              type: PathPrefix
              value: /foo
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: path-only
      # Headers and path HTTPRoute is configured with correct rules
      - contains:
          path: spec.rules[0].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: headers-and-path
      - contains:
          path: spec.rules[0].matches
          content:
            headers:
              - name: foo
                value: bar
              - name: baz
                value: qux
            path:
              type: PathPrefix
              value: /foo
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: headers-and-path

  # Rule-level filters apply to every request the rule matches, which is the
  # only place GKE accepts them. requestMirror in particular has no per-backend
  # equivalent, since a mirror copies the whole rule's traffic.
  - it: Rule-level filters render alongside matches and the default backendRef
    asserts:
      - equal:
          path: spec.rules[0].filters
          value:
            - type: RequestMirror
              requestMirror:
                backendRef:
                  kind: Service
                  name: test-service-shadow
                  port: 8080
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                set:
                  - name: X-Shadowed
                    value: "true"
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: rule-filters
      - contains:
          path: spec.rules[0].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: rule-filters

  # A rule whose filters redirect is terminal, so the default backendRef the
  # chart would otherwise add is dead weight and gets dropped.
  - it: A redirect filter drops the default backendRef
    asserts:
      - notExists:
          path: spec.rules[0].backendRefs
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: redirect-filter
      - equal:
          path: spec.rules[0].filters[0].requestRedirect.statusCode
          value: 301
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: redirect-filter

  # GKE rejects backendRef-level filters with GWCER104 and then stops
  # programming the whole Gateway, so the chart refuses to render them. Other
  # providers keep the Gateway API behaviour.
  - it: Per-backendRef filters fail on GKE and render everywhere else
    values:
      - values/globals.yaml
      - values/httproute-backendref-filters.yaml
    asserts:
      - failedTemplate:
          errorPattern: "hosts.backendref-filters: GKE rejects filters on HTTPRoute backendRefs"

  - it: Per-backendRef filters render on each weighted backend off GKE
    values:
      - values/globals.yaml
      - values/traefik-gateway-configuration.yaml
      - values/httproute-backendref-filters.yaml
    asserts:
      - contains:
          path: spec.rules[0].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 100
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: X-Canary
                      value: stable
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: backendref-filters
      - contains:
          path: spec.rules[0].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service-canary
            port: 8080
            weight: 0
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: X-Canary
                      value: canary
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: backendref-filters
