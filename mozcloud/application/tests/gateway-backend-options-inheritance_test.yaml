---
suite: "mozcloud: Gateway explicit backends inherit host options"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/gateway-backend-options-inheritance.yaml
templates:
  - gke/backend.yaml
  - gateway/backend.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Backend without an override inherits every host option
    template: gke/backend.yaml
    documentSelector:
      path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
      value: app
    asserts:
      - equal:
          path: spec.default.iap.enabled
          value: true
      - equal:
          path: spec.default.iap.clientID
          value: my-client-id
      - equal:
          path: spec.default.iap.oauth2ClientSecret.name
          value: my-client-secret
      - equal:
          path: spec.default.securityPolicy
          value: host-policy
      - equal:
          path: spec.default.timeoutSec
          value: 120
      - equal:
          path: spec.default.logging.sampleRate
          value: 500000

  - it: Backend overriding iap.enabled to false is exempted but keeps the other options
    template: gke/backend.yaml
    documentSelector:
      path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
      value: app-webhook
    asserts:
      # An exempt backend omits the iap block entirely, which is how a
      # GCPBackendPolicy represents an unprotected backend.
      - notExists:
          path: spec.default.iap
      - equal:
          path: spec.default.securityPolicy
          value: host-policy
      - equal:
          path: spec.default.timeoutSec
          value: 120
      - equal:
          path: spec.default.logging.sampleRate
          value: 500000

  - it: Every explicit backend gets a GCPBackendPolicy and a HealthCheckPolicy
    template: gke/backend.yaml
    asserts:
      # Regression guard: explicit backends used to render neither policy, so a
      # host's Cloud Armor policy, timeout and IAP settings were dropped as
      # soon as the tenant declared backends.
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app-webhook
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: app
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: app-webhook

  - it: Backend iap.enabled true overrides a host default of false
    set:
      workloads.my-app.hosts.iap-host.options.iap.enabled: false
      workloads.my-app.hosts.iap-host.backends.app-webhook.options.iap.enabled: true
    template: gke/backend.yaml
    asserts:
      - notExists:
          path: spec.default.iap
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app
      - equal:
          path: spec.default.iap.enabled
          value: true
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app-webhook

  - it: backendPolicy.enabled false suppresses an inherited GCPBackendPolicy
    set:
      workloads.my-app.hosts.iap-host.backends.app-webhook.backendPolicy.enabled: false
    template: gke/backend.yaml
    asserts:
      - hasDocuments:
          count: 3
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: app

  - it: healthCheck.enabled false suppresses an inherited HealthCheckPolicy
    set:
      workloads.my-app.hosts.iap-host.backends.app-webhook.healthCheck.enabled: false
    template: gke/backend.yaml
    asserts:
      - hasDocuments:
          count: 3
      - exists:
          path: metadata.name
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: app
