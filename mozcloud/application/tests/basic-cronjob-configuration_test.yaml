---
suite: "mozcloud: Basic cron job configuration"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/basic-cronjob-configuration.yaml
templates:
  - task/cronjob.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - matchSnapshot: {}

  - it: CronJob renders without failures and is configured correctly
    template: task/cronjob.yaml
    asserts:
      - notFailedTemplate: {}
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.concurrencyPolicy
          value: Allow
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - matchRegex:
          path: spec.schedule
          pattern: ^(0 \* \* \* \*|@hourly)$
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 1
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 6
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.parallelism
          value: 1
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - lengthEqual:
          path: spec.jobTemplate.spec.template.spec.containers
          count: 1
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: test-repo/test-image:latest
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["sh", "-c"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["echo", "foo", "bar"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].name
          value: job
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - isSubset:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources
          content:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - isSubset:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext
          content:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - exists:
          path: spec.jobTemplate.spec.template.spec.securityContext
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - isSubset:
          path: spec.jobTemplate.spec.template.spec.securityContext
          content:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob

  - it: CronJob renders startingDeadlineSeconds only when it is configured
    template: task/cronjob.yaml
    asserts:
      - equal:
          path: spec.startingDeadlineSeconds
          value: 600
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob-with-deadline
      - equal:
          path: spec.startingDeadlineSeconds
          value: 0
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob-zero-deadline
      - notExists:
          path: spec.startingDeadlineSeconds
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob

  - it: CronJob renders topologySpreadConstraints from its jobConfig
    template: task/cronjob.yaml
    values:
      - values/globals.yaml
      - values/basic-cronjob-configuration.yaml
      - values/cronjob-scheduling-configuration.yaml
    asserts:
      # Cron jobs reach the shared job template through jobConfig rather than
      # directly, so the job-level assertion does not cover this path.
      - equal:
          path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: test-chart
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - notExists:
          path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob-with-deadline

  - it: CronJob labels and annotations stay on the CronJob, jobConfig labels the pods
    template: task/cronjob.yaml
    values:
      - values/globals.yaml
      - values/basic-cronjob-configuration.yaml
      - values/cronjob-labels-annotations-configuration.yaml
    asserts:
      - equal:
          path: metadata.labels.team
          value: mozcloud
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: mozcloud
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      # The CronJob's own metadata is not inherited by the pods it runs.
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.labels.team
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      # jobConfig configures the pod template, so its labels land there and
      # nowhere else.
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels.tier
          value: batch
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - notExists:
          path: metadata.labels.tier
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      # A CronJob renders no Job resource of its own, so a jobConfig annotation
      # has nothing to attach to and is dropped. Pinned here so that wiring it
      # up later is a deliberate change rather than an accident.
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.annotations["example.com/ignored"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      - notExists:
          path: metadata.annotations["example.com/ignored"]
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob
      # The other cron jobs in the fixture stay clean.
      - notExists:
          path: metadata.labels.team
        documentSelector:
          path: $[?(@.kind == "CronJob")].metadata.name
          value: test-cronjob-with-deadline
