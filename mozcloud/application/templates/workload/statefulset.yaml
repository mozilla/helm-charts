{{- $chartMetadata := dict "Chart" .Chart "Release" .Release }}
{{- $context := deepCopy . }}
{{- $labelParams := mergeOverwrite $chartMetadata (include "mozcloud.labelParams" . | fromYaml) }}
{{- /* Format workloads, removing default container and merging user-defined values with defaults */}}
{{- $previewConfig := mergeOverwrite (default dict .Values.global.preview) (default dict .Values.preview) }}
{{- $formatterParams := dict "workloads" (.Values.workloads | deepCopy) "preview" $previewConfig }}
{{- $workloads := include "mozcloud.formatter.workloads" $formatterParams | fromYaml -}}

{{- range $workloadName, $workloadConfig := $workloads }}
{{- if eq (default "deployment" $workloadConfig.type) "statefulset" }}
{{- $statefulSetConfig := $workloadConfig.statefulSet }}
{{- $serviceName := default (printf "%s-headless" $workloadName) $statefulSetConfig.serviceName }}
{{- /* Format containers for headless Service port enumeration */}}
{{- $containerFormatterParams := dict "containers" $workloadConfig.containers "type" "containers" }}
{{- $containers := include "mozcloud.formatter.containers" $containerFormatterParams | fromYaml }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $workloadName }}
  labels:
    {{- $component := dict "component_code" $workloadConfig.component }}
    {{- $params := dict "context" (mergeOverwrite (deepCopy $context) (mergeOverwrite (deepCopy $labelParams) $component)) "labels" (default dict $workloadConfig.labels) }}
    {{- $labels := include "mozcloud.labels" $params | fromYaml }}
    {{- $labels.labels | toYaml | nindent 4 }}
  {{- $params = dict "annotations" (default dict $workloadConfig.annotations) "context" $context "type" "deployment" }}
  {{- $annotations := include "mozcloud.annotations" $params | fromYaml }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  {{- /* Only pin replicas when the chart owns scaling; an external autoscaler needs the field absent. */}}
  {{- if and (not (dig "autoscaling" "enabled" true $workloadConfig)) (hasKey $workloadConfig "replicas") }}
  replicas: {{ $workloadConfig.replicas }}
  {{- end }}
  {{- /* Opt-in soak period before a ready pod counts as available. Emitted only when
     set, so existing workloads render unchanged. */}}
  {{- if hasKey $workloadConfig "minReadySeconds" }}
  minReadySeconds: {{ $workloadConfig.minReadySeconds }}
  {{- end }}
  {{- if hasKey $workloadConfig "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ $workloadConfig.revisionHistoryLimit }}
  {{- end }}
  selector:
    matchLabels:
      {{- $labels.selectorLabels | toYaml | nindent 6 }}
  serviceName: {{ $serviceName }}
  podManagementPolicy: {{ $statefulSetConfig.podManagementPolicy }}
  updateStrategy:
    type: {{ $workloadConfig.strategy }}
    {{- if and (eq $workloadConfig.strategy "RollingUpdate") $statefulSetConfig.partition }}
    rollingUpdate:
      partition: {{ $statefulSetConfig.partition }}
    {{- end }}
  {{- if $statefulSetConfig.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- range $vctName, $vctSpec := $statefulSetConfig.volumeClaimTemplates }}
    - metadata:
        name: {{ $vctName }}
      spec:
        {{- if $vctSpec.accessMode }}
        accessModes:
          - {{ $vctSpec.accessMode }}
        {{- end }}
        {{- if $vctSpec.storageClassName }}
        storageClassName: {{ $vctSpec.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ $vctSpec.storage }}
    {{- end }}
  {{- end }}
  {{- /*
  The template below can be found in templates/workload/_workloadTemplate.yaml
  */}}
  {{- $params = dict "config" $workloadConfig "context" $context "name" $workloadName }}
  {{- include "mozcloud.workload.workloadTemplate" $params | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- $labels.labels | toYaml | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- $labels.selectorLabels | toYaml | nindent 4 }}
  {{- /* Collect all (name, port) tuples from every container's primary port
     and additionalPorts, sanitizing names via mozcloud.portName. Kubernetes
     requires both port names and (protocol, port) tuples to be unique within
     a Service; fail fast at template time rather than at apply. */}}
  {{- $servicePorts := list -}}
  {{- $seenPortNames := dict -}}
  {{- $seenPortNumbers := dict -}}
  {{- range $containerName, $containerConfig := $containers -}}
    {{- if $containerConfig.port -}}
      {{- $portName := include "mozcloud.portName" (dict "name" $containerName "containerConfig" $containerConfig) -}}
      {{- $portNumber := $containerConfig.port | toString -}}
      {{- if hasKey $seenPortNames $portName }}{{ fail (printf "duplicate Service port name %q on statefulset %q (from container %q); port names must be unique across all containers' ports and additionalPorts" $portName $workloadName $containerName) }}{{ end -}}
      {{- if hasKey $seenPortNumbers $portNumber }}{{ fail (printf "duplicate Service port number %s on statefulset %q (from container %q); port numbers must be unique across all containers' ports and additionalPorts" $portNumber $workloadName $containerName) }}{{ end -}}
      {{- $_ := set $seenPortNames $portName true -}}
      {{- $_ := set $seenPortNumbers $portNumber true -}}
      {{- $servicePorts = append $servicePorts (dict "name" $portName "port" $containerConfig.port) -}}
    {{- end -}}
    {{- range $additionalPort := default list $containerConfig.additionalPorts -}}
      {{- /* A K8s Service with >1 port requires each entry to be named. When
         the user omitted `name` on the additionalPort, synthesize a stable
         one from the port number so the headless Service stays valid. */ -}}
      {{- $portName := "" -}}
      {{- if $additionalPort.name -}}
        {{- $portName = include "mozcloud.portName" (dict "name" $additionalPort.name) -}}
      {{- else -}}
        {{- $portName = printf "port-%d" (int $additionalPort.port) -}}
      {{- end -}}
      {{- $portNumber := $additionalPort.port | toString -}}
      {{- if hasKey $seenPortNames $portName }}{{ fail (printf "duplicate Service port name %q on statefulset %q (from container %q additionalPorts); port names must be unique across all containers' ports and additionalPorts" $portName $workloadName $containerName) }}{{ end -}}
      {{- if hasKey $seenPortNumbers $portNumber }}{{ fail (printf "duplicate Service port number %s on statefulset %q (from container %q additionalPorts); port numbers must be unique across all containers' ports and additionalPorts" $portNumber $workloadName $containerName) }}{{ end -}}
      {{- $_ := set $seenPortNames $portName true -}}
      {{- $_ := set $seenPortNumbers $portNumber true -}}
      {{- $servicePorts = append $servicePorts (dict "name" $portName "port" $additionalPort.port) -}}
    {{- end -}}
  {{- end }}
  ports:
    {{- range $servicePort := $servicePorts }}
    - name: {{ $servicePort.name }}
      port: {{ $servicePort.port }}
      targetPort: {{ $servicePort.port }}
    {{- end }}
{{- $nginxEnabled := and (dig "nginx" "enabled" "true" $workloadConfig) $workloadConfig.hosts }}
{{- if and $nginxEnabled (not $workloadConfig.nginx.configMap) }}
---
{{- include "mozcloud.workload.nginxConfigMap" (dict
  "labels" $labels
  "name" $workloadName
) }}
{{- end }}
{{- end }}
{{- end }}
