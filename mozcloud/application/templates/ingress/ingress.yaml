{{/*
Ingresses
*/}}
{{- /*
Builds the "ingresses" configuration structure expected by the
mozcloud-ingress-lib library chart. Only processes hosts with type "external"
since internal hosts are not exposed via Ingress resources.

For each qualifying host, constructs a full ingress entry including:
  - Domain list and path rules (a single "/" Prefix path per host).
  - TLS configuration, supporting ManagedCertificate (default), certmap, and
    pre-shared certificate types.
  - Backend service reference with port 8080.
  - Optional BackendConfig settings for IAP, access log sample rate, and
    timeout, taken from the host's "options" and overridable per backend
    through backends.<name>.options.
  - Static IP name, defaulting to "<app_code>-<env_code>-ip-v4".

Params:
  globals (dict):   (required) Global MozCloud values from
                    .Values.global.mozcloud.
  workloads (dict): (required) The formatted workloads dict as returned by
                    mozcloud.formatter.workloads.

Returns:
  (string) YAML-encoded dict with a top-level "ingresses" key containing
           ingress configurations keyed by host name.
*/ -}}
{{- define "mozcloud.config.ingresses" -}}
{{- $cloudCertManager := default dict .cloudCertManager }}
{{- $globals := .globals }}
{{- $workloads := .workloads }}
ingresses:
  {{- range $workloadName, $workloadConfig := $workloads }}
  {{- range $hostName, $hostConfig := default dict $workloadConfig.hosts }}
  {{- if eq $hostConfig.type "external" }}
  {{- /* When hosts.<host>.backends is set, each dict key becomes the Service /
     BackendConfig name and the cloud.google.com/backend-config annotation
     reference. When backends is unset, fall back to a single default entry
     named after the workload. */}}
  {{- $backends := default (dict $workloadName (dict)) $hostConfig.backends }}
  {{- /* Filter out backends with enabled: false so they are skipped during
     rendering and the duplicate-path check. */}}
  {{- $enabledBackends := dict }}
  {{- range $name, $config := $backends }}
    {{- if dig "enabled" true $config }}
      {{- $_ := set $enabledBackends $name $config }}
    {{- end }}
  {{- end }}
  {{- $backends = $enabledBackends }}
  {{- /* Reject duplicate (path, pathType) tuples up front. Kubernetes does not
     enforce uniqueness; GKE silently routes duplicates non-deterministically. */}}
  {{- if gt (len $backends) 1 }}
    {{- $paths := list }}
    {{- range $name, $config := $backends }}
      {{- $path := default "/" $config.path }}
      {{- $pathType := default "Prefix" $config.pathType }}
      {{- $paths = append $paths (printf "%s|%s" $path $pathType) }}
    {{- end }}
    {{- if ne (len $paths) (len (uniq $paths)) }}
      {{- fail (printf "hosts.%s.backends contains duplicate (path, pathType) entries; each backend on a single host must have a unique path/pathType combination." $hostName) }}
    {{- end }}
  {{- end }}
  {{- /* A Service carries a single cloud.google.com/backend-config annotation
     per port, so backends that resolve to the same Service cannot have
     different IAP postures. GKE would silently bind them all to whichever
     BackendConfig the first backend produced, leaving a path the tenant
     believes is exempt (or protected) doing the opposite. */}}
  {{- $iapByService := dict }}
  {{- range $name, $config := $backends }}
    {{- $service := default $name ($config.service).name }}
    {{- $backendOptions := mergeOverwrite (deepCopy (default dict $hostConfig.options)) (deepCopy (default dict $config.options)) }}
    {{- $iap := ternary "enabled" "disabled" (dig "iap" "enabled" false $backendOptions) }}
    {{- if hasKey $iapByService $service }}
      {{- if ne (index $iapByService $service) $iap }}
        {{- fail (printf "hosts.%s.backends: backends sharing Service %q declare conflicting IAP postures. A Service carries a single cloud.google.com/backend-config annotation per port, so give the IAP-exempt backend its own Service via backends.<name>.service.name, or align their options.iap.enabled values." $hostName $service) }}
      {{- end }}
    {{- else }}
      {{- $_ := set $iapByService $service $iap }}
    {{- end }}
  {{- end }}
  {{ $hostName }}:
    component: {{ $workloadConfig.component }}
    hosts:
      - domains:
          {{- range $domain := $hostConfig.domains }}
          - {{ $domain | quote }}
          {{- end }}
        paths:
          {{- range $backendName, $backendConfig := $backends }}
          {{- $backendService := default dict $backendConfig.service }}
          {{- $serviceName := default $backendName $backendService.name }}
          {{- $port := default $hostConfig.servicePort $backendService.port }}
          {{- $targetPort := $backendService.targetPort | default $hostConfig.targetPort | default "http" }}
          {{- $path := default "/" $backendConfig.path }}
          {{- $pathType := default "Prefix" $backendConfig.pathType }}
          {{- /* Host options are the default for every backend on the host; a
             backend's own options block overrides them field by field. deepCopy
             keeps one backend's merge from leaking into the next iteration. */}}
          {{- $options := mergeOverwrite (deepCopy (default dict $hostConfig.options)) (deepCopy (default dict $backendConfig.options)) }}
          - path: {{ $path }}
            pathType: {{ $pathType }}
            backend:
              config:
                name: {{ $backendName }}
                {{- /* Emitted only when IAP resolves to enabled. A backend that
                   overrides the host default with `iap.enabled: false` drops the
                   block entirely, which is how a BackendConfig represents an
                   unprotected backend. */}}
                {{- if ($options.iap).enabled }}
                iap:
                  enabled: {{ $options.iap.enabled }}
                {{- end }}
                {{- if $options.logSampleRate }}
                logging:
                  {{- $sampleRate := $options.logSampleRate | float64 }}
                  sampleRate: {{ divf $sampleRate 100 }}
                {{- end }}
                {{- if $options.timeoutSec }}
                timeoutSec: {{ $options.timeoutSec }}
                {{- end }}
                {{- if $options.securityPolicy }}
                securityPolicy: {{ $options.securityPolicy }}
                {{- end }}
                {{- if $options.customRequestHeaders }}
                customRequestHeaders:
                  headers:
                    {{- range $options.customRequestHeaders }}
                    - {{ . | quote }}
                    {{- end }}
                {{- end }}
                {{- if $options.customResponseHeaders }}
                customResponseHeaders:
                  headers:
                    {{- range $options.customResponseHeaders }}
                    - {{ . | quote }}
                    {{- end }}
                {{- end }}
                {{- $healthCheck := default dict $options.healthCheck }}
                {{- /* Gate on the BackendConfig-supported fields only so a values
                   override that sets only gateway-only keys (host/path) does
                   not emit an empty healthCheck block on the ingress path. */}}
                {{- if or $healthCheck.requestPath $healthCheck.port $healthCheck.type $healthCheck.checkIntervalSec $healthCheck.timeoutSec $healthCheck.healthyThreshold $healthCheck.unhealthyThreshold }}
                healthCheck:
                  {{- if $healthCheck.requestPath }}
                  requestPath: {{ $healthCheck.requestPath | quote }}
                  {{- end }}
                  {{- if $healthCheck.port }}
                  port: {{ $healthCheck.port }}
                  {{- end }}
                  {{- if $healthCheck.type }}
                  type: {{ $healthCheck.type }}
                  {{- end }}
                  {{- if $healthCheck.checkIntervalSec }}
                  checkIntervalSec: {{ $healthCheck.checkIntervalSec }}
                  {{- end }}
                  {{- if $healthCheck.timeoutSec }}
                  timeoutSec: {{ $healthCheck.timeoutSec }}
                  {{- end }}
                  {{- if $healthCheck.healthyThreshold }}
                  healthyThreshold: {{ $healthCheck.healthyThreshold }}
                  {{- end }}
                  {{- if $healthCheck.unhealthyThreshold }}
                  unhealthyThreshold: {{ $healthCheck.unhealthyThreshold }}
                  {{- end }}
                {{- end }}
              service:
                name: {{ $serviceName }}
                port: {{ $port }}
                protocol: TCP
                targetPort: {{ include "mozcloud.portName" (dict "name" $targetPort) }}
          {{- end }}
        tls:
          {{- $type := ($hostConfig.tls.type) }}
          {{- if or (not $type) (eq $type "certmap") }}
            {{- $type = "ManagedCertificate" }}
          {{- end }}
          type: {{ $type }}
          {{- if hasKey $hostConfig.tls "create" }}
          createCertificates: {{ $hostConfig.tls.create }}
          {{- end }}
          {{- if and (eq $type "ManagedCertificate") (hasKey $hostConfig.tls "create") (not $hostConfig.tls.create) (not $hostConfig.tls.certs) }}
            {{- fail "tls.certs must be provided when tls.type is ManagedCertificate and tls.create is false" }}
          {{- end }}
          {{- if and (eq $type "ManagedCertificate") ($hostConfig.tls.certs) }}
          certNames:
            {{- range $cert := $hostConfig.tls.certs }}
            - {{ $cert | quote }}
            {{- end }}
          {{- else if and (hasKey $hostConfig.tls "create") ($hostConfig.tls.create) (eq $type "ManagedCertificate") }}
          multipleHosts: false
          {{- end }}
          {{- if eq $type "ManagedCertificate" }}
          prefix: {{ default "" $hostConfig.tls.prefix | quote }}
          {{- end }}
          {{- if eq $type "pre-shared" }}
          preSharedCerts: {{ join "," (uniq $hostConfig.tls.certs | sortAlpha) | quote }}
          {{- end }}
          {{- if eq $type "certManager" }}
          {{- $certManagerIssuer := default $cloudCertManager.issuer $hostConfig.tls.issuer }}
          {{- $certManagerIssuerKind := default (default "ClusterIssuer" $cloudCertManager.issuerKind) $hostConfig.tls.issuerKind }}
          certManager:
            issuer: {{ required "tls.issuer or cloud.certManager.issuer is required when tls.type is certManager" $certManagerIssuer | quote }}
            issuerKind: {{ $certManagerIssuerKind | quote }}
            secretName: {{ required "tls.certs must have at least one entry when tls.type is certManager" (first (default (list) $hostConfig.tls.certs)) | quote }}
          {{- end }}
          {{- if eq $type "secret" }}
          {{- $secretName := first (default (list) $hostConfig.tls.certs) }}
          {{- if $secretName }}
          secret:
            secretName: {{ $secretName | quote }}
          {{- end }}
          {{- end }}
    {{- if $hostConfig.addresses }}
    staticIpName: {{ $hostConfig.addresses | first }}
    {{- else }}
    staticIpName: {{ $globals.app_code }}-{{ $globals.env_code }}-ip-v4
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end -}}

{{- /* We do not use ingress resources for preview environments */}}
{{- if and .Values.enabled (not (include "mozcloud.preview.enabled" .)) }}
  {{- $chartMetadata := dict "Chart" .Chart "Release" .Release }}
  {{- $context := deepCopy . }}
  {{- $labelParams := mergeOverwrite $chartMetadata (include "mozcloud.labelParams" . | fromYaml) }}
  {{- /* Call a helper function that merges user data with defaults */}}
  {{- $previewConfig := mergeOverwrite (default dict .Values.global.preview) (default dict .Values.preview) }}
  {{- /* Get only workloads where "api: ingress" is set */}}
  {{- $formatterParams := dict "api" "ingress" "workloads" (.Values.workloads | deepCopy) "preview" $previewConfig }}
  {{- $workloads := include "mozcloud.formatter.workloads" $formatterParams | fromYaml -}}

  {{- /*
  Only include Ingress and related resources if we have Ingress hosts defined
  */}}
  {{- $hosts := list }}
  {{- range $workloadName, $workloadConfig := $workloads }}
    {{- range $hostName, $hostConfig := $workloadConfig.hosts }}
      {{- $hosts = append $hosts $hostName }}
    {{- end }}
  {{- end }}
  {{- if gt (len $hosts) 0 }}
    {{- /*
    Ingresses and related resources
    */}}
    {{- $cloudConfig := default dict .Values.cloud }}
    {{- $provider := default "gke" $cloudConfig.provider }}
    {{- $cloudIngressConfig := default dict $cloudConfig.ingress }}
    {{- /* Resolve ingressClass: cloud.ingress.<default>.ingressClass → cloud.ingress.default → "" */}}
    {{- $defaultController := $cloudIngressConfig.default }}
    {{- $controllerConfig := dict }}
    {{- if $defaultController }}
      {{- $controllerConfig = default dict (index $cloudIngressConfig $defaultController) }}
    {{- end }}
    {{- $ingressClass := default $defaultController $controllerConfig.ingressClass }}
    {{- $cloudCertManager := default dict $cloudConfig.certManager }}
    {{- $params := mergeOverwrite $context (dict "globals" .Values.global.mozcloud "workloads" $workloads "provider" $provider "ingressClass" $ingressClass "cloudCertManager" $cloudCertManager) }}
    {{- $ingresses := (include "mozcloud.config.ingresses" $params | fromYaml).ingresses }}
    {{- range $ingressName, $ingressConfig := $ingresses }}
      {{- $_ := set $labelParams "component_code" $ingressConfig.component }}
      {{- $_ = set $params "ingressConfig" (dict $ingressName (omit $ingressConfig "component")) }}
{{ include "mozcloud-ingress-lib.ingress" (mergeOverwrite $params $labelParams) }}
{{ include "mozcloud-ingress-lib.service" (mergeOverwrite $params $labelParams) }}
    {{- end }}
  {{- end }}
{{- end -}}
