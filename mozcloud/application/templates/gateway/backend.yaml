{{- /*
Builds the "backends" configuration structure expected by the
mozcloud-gateway-lib library chart. For each workload host, produces backend
entries that drive Service, BackendPolicy, and HealthCheckPolicy resource
generation.

When a host defines explicit "backends" entries (a dict keyed by backend name),
each entry's key becomes the resource name for the Service, BackendPolicy, and
HealthCheckPolicy. Entries may optionally set service, backendPolicy, and
healthCheck overrides; an empty entry (`my-backend: {}`) renames the default
resources without otherwise changing behavior.

Every explicit backend inherits the host's "options" (IAP, log sample rate,
timeout, Cloud Armor policy, health check) and may override any of them through
its own "options" block. Set backendPolicy.enabled or healthCheck.enabled to
false to suppress an inherited policy entirely.

When no explicit backends are defined, a default backend is generated for the
workload with:
  - A Service on port 8080.
  - A BackendPolicy with access logging enabled (and optional IAP, sample rate,
    and timeout settings from host options).
  - A HealthCheckPolicy derived from host options or healthCheckEndpoints.

Params:
  workloads (dict): (required) The formatted workloads dict as returned by
                    mozcloud.formatter.workloads.

Returns:
  (string) YAML-encoded dict with a top-level "backends" key containing
           backend configurations keyed by backend or workload name.
*/ -}}
{{- define "mozcloud.gateway.backends" -}}
{{- $workloads := .workloads -}}
{{- $provider := index (index .Values "cloud" | default dict) "provider" | default "gke" -}}
{{- /* Default LB health check path mirrors the chart's default container
   readiness probe path so both probe systems agree on the same endpoint
   unless the user overrides either. */ -}}
{{- $defaultHealthCheckPath := .Values.workloads.default.containers.default.healthCheck.readiness.path -}}
backends:
  {{- range $workloadName, $workloadConfig := $workloads }}
  {{- range $hostName, $hostConfig := default dict $workloadConfig.hosts }}
  {{- if $hostConfig.backends }}
  {{- $enabledBackends := dict }}
  {{- range $name, $config := $hostConfig.backends }}
    {{- if dig "enabled" true $config }}
      {{- $_ := set $enabledBackends $name $config }}
    {{- end }}
  {{- end }}
  {{- range $backendName, $backendConfig := $enabledBackends }}
  {{- /* Host options are the default for every backend on the host; a backend's
     own options block overrides them field by field. deepCopy keeps one
     backend's merge from leaking into the next iteration. */}}
  {{- $options := mergeOverwrite (deepCopy (default dict $hostConfig.options)) (deepCopy (default dict $backendConfig.options)) }}
  {{- $backendPolicy := default dict $backendConfig.backendPolicy }}
  {{- $healthCheck := default dict $backendConfig.healthCheck }}
  {{- $hostHealthCheck := default dict $options.healthCheck }}
  {{ $backendName }}:
    component: {{ $workloadConfig.component }}
    api: {{ default "gateway" $hostConfig.api }}
    {{- if $backendConfig.service }}
    service:
      {{- $backendConfig.service | toYaml | nindent 6 }}
    {{- end }}
    {{- if and (eq $provider "gke") (dig "enabled" true $backendPolicy) }}
    backendPolicy:
      logging:
        enabled: true
      {{- /* Presence check so logSampleRate 0 is honored, not omitted. */}}
      {{- if hasKey $options "logSampleRate" }}
        {{- $sampleRate := $options.logSampleRate | float64 }}
        sampleRate: {{ mulf $sampleRate 10000 | int }}
      {{- end }}
      {{- /* Emitted only when IAP resolves to enabled. A backend that overrides
         the host default with `iap.enabled: false` drops the block entirely,
         which is how GCP represents an unprotected backend. */}}
      {{- if ($options.iap).enabled }}
      iap:
        enabled: true
        {{- if $options.iap.oauth2ClientId }}
        oauth2ClientId: {{ $options.iap.oauth2ClientId }}
        {{- end }}
        {{- if $options.iap.oauth2ClientSecret }}
        oauth2ClientSecret: {{ $options.iap.oauth2ClientSecret }}
        {{- end }}
      {{- end }}
      {{- if $options.timeoutSec }}
      timeoutSec: {{ $options.timeoutSec | int }}
      {{- end }}
      {{- if $options.securityPolicy }}
      securityPolicy: {{ $options.securityPolicy }}
      {{- end }}
      {{- /* targetRef is optional. When omitted, the library auto-populates a
         targetRef referencing the resolved Service name. */}}
      {{- if $backendPolicy.targetRef }}
      targetRef:
        {{- if and $backendPolicy.targetRef.kind (eq $backendPolicy.targetRef.kind "ServiceImport" )}}
        {{- $_ := set $backendPolicy.targetRef "group" "net.gke.io" }}
        {{- end }}
        group: {{ default "" $backendPolicy.targetRef.group | quote }}
        kind: {{ $backendPolicy.targetRef.kind }}
        name: {{ $backendPolicy.targetRef.name }}
      {{- end }}
    {{- end }}
    {{- if and (eq $provider "gke") (dig "enabled" true $healthCheck) }}
    healthCheck:
      {{- $lbEndpoint := ($hostConfig.healthCheckEndpoints).loadBalancer }}
      {{- $lbPath := "" }}
      {{- if kindIs "string" $lbEndpoint }}
        {{- $lbPath = $lbEndpoint }}
      {{- else if kindIs "map" $lbEndpoint }}
        {{- $lbPath = default "" $lbEndpoint.path }}
      {{- end }}
      path: {{ $healthCheck.path | default $hostHealthCheck.path | default $lbPath | default $defaultHealthCheckPath }}
      {{- $healthCheckPort := $healthCheck.port | default $hostHealthCheck.port }}
      {{- if $healthCheckPort }}
      port: {{ $healthCheckPort }}
      {{- end }}
      {{- $healthCheckHost := $healthCheck.host | default $hostHealthCheck.host }}
      {{- if $healthCheckHost }}
      host: {{ $healthCheckHost }}
      {{- end }}
      {{- /* targetRef is optional. When omitted, the library auto-populates a
         targetRef referencing the resolved Service name. */}}
      {{- if $healthCheck.targetRef }}
      targetRef:
        {{- if and $healthCheck.targetRef.kind (eq $healthCheck.targetRef.kind "ServiceImport" )}}
        {{- $_ := set $healthCheck.targetRef "group" "net.gke.io" }}
        {{- end }}
        group: {{ default "" $healthCheck.targetRef.group | quote }}
        kind: {{ default "Service" $healthCheck.targetRef.kind }}
        name: {{ $healthCheck.targetRef.name }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- else }}
  {{ $workloadName }}:
    component: {{ $workloadConfig.component }}
    api: {{ default "gateway" $hostConfig.api }}
    service:
      port: {{ $hostConfig.servicePort }}
      targetPort: {{ include "mozcloud.portName" (dict "name" (default "http" $hostConfig.targetPort)) }}
    {{- if eq $provider "gke" }}
    backendPolicy:
      logging:
        enabled: true
      {{- /* Presence check so logSampleRate 0 is honored, not omitted. */}}
      {{- if hasKey (default dict $hostConfig.options) "logSampleRate" }}
        {{- $sampleRate := $hostConfig.options.logSampleRate | float64 }}
        sampleRate: {{ mulf $sampleRate 10000 | int }}
      {{- end }}
      {{- if ($hostConfig.options).iap }}
      iap:
        {{- if $hostConfig.options.iap.enabled }}
        enabled: {{ $hostConfig.options.iap.enabled }}
        {{- end }}
        {{- if $hostConfig.options.iap.oauth2ClientId }}
        oauth2ClientId: {{ $hostConfig.options.iap.oauth2ClientId }}
        {{- end }}
        {{- if $hostConfig.options.iap.oauth2ClientSecret }}
        oauth2ClientSecret: {{ $hostConfig.options.iap.oauth2ClientSecret }}
        {{- end }}
      {{- end }}
      {{- if ($hostConfig.options).timeoutSec }}
      timeoutSec: {{ $hostConfig.options.timeoutSec | int }}
      {{- end }}
      {{- if ($hostConfig.options).securityPolicy }}
      securityPolicy: {{ $hostConfig.options.securityPolicy }}
      {{- end }}
    healthCheck:
      {{- if (($hostConfig.options).healthCheck).host }}
      host: {{ $hostConfig.options.healthCheck.host }}
      {{- end }}
      {{- if (($hostConfig.options).healthCheck).port }}
      port: {{ $hostConfig.options.healthCheck.port }}
      {{- end }}
      {{- if (($hostConfig.options).healthCheck).path }}
      path: {{ $hostConfig.options.healthCheck.path }}
      {{- else if kindIs "string" (($hostConfig).healthCheckEndpoints).loadBalancer }}
      path: {{ default $defaultHealthCheckPath (($hostConfig).healthCheckEndpoints).loadBalancer }}
      {{- else if kindIs "map" (($hostConfig).healthCheckEndpoints).loadBalancer }}
      path: {{ default $defaultHealthCheckPath ($hostConfig.healthCheckEndpoints.loadBalancer).path }}
      {{- end }}
      protocol: HTTP
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end -}}

{{- $chartMetadata := dict "Chart" .Chart "Release" .Release }}
{{- $context := deepCopy . }}
{{- $labelParams := mergeOverwrite $chartMetadata (include "mozcloud.labelParams" . | fromYaml) }}
{{- /* Call a helper function that merges user data with defaults */}}
{{- $previewConfig := mergeOverwrite (default dict .Values.global.preview) (default dict .Values.preview) }}
{{- /* Get ALL workloads (unfiltered by api type) for backend processing
     This allows backends to be created even for hosts with api: none */}}
{{- $formatterParams := dict "workloads" (.Values.workloads | deepCopy) "preview" $previewConfig }}
{{- $workloads := dict "workloads" (include "mozcloud.formatter.workloads" $formatterParams | fromYaml) -}}

{{- /*
Backend services, backend policies, and health check policies.

Only create these for workloads with "api: gateway" or "api: none".
templates/ingress handles service creation for "api: ingress" workloads.
*/}}
{{- $backendParams := mergeOverwrite $context $workloads }}
{{- $backends := include "mozcloud.gateway.backends" $backendParams | fromYaml }}
{{- range $backendName, $backendConfig := $backends.backends }}
  {{- /* Only render backend resources if api is not ingress */}}
  {{- if ne $backendConfig.api "ingress" }}
    {{- $_ := set $labelParams "component_code" $backendConfig.component }}
    {{- $params := dict "backendConfig" (dict "backends" (dict $backendName (omit $backendConfig "component" "api"))) }}
{{ include "mozcloud-gateway-lib.service" (mergeOverwrite $params $labelParams) }}
  {{- end }}
{{- end }}
