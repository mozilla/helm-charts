---
# A workload missing serviceAccountName -- the schema must reject this rather
# than let the template render spec.serviceAccountName: <no value>.
workloads:
  test-service-ray-no-sa:
    component: test-service
    containers:
      test-service-ray-no-sa-head:
        image:
          repository: test-repo/test-service
          tag: "1.0.0"
    ray:
      rayVersion: "2.44.1"
      serveConfigV2:
        applications:
          - name: app
            import_path: test_service.main:app
            route_prefix: /
