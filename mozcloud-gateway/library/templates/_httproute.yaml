{{- /*
A rule whose filters redirect never reaches a backend, so it carries no
backendRefs and the list item starts with the filters block instead. The
rewrite shorthand wins over redirect in rule.filters, so a rule that sets both
still renders a rewrite and keeps its backendRefs.

Params:
  . (dict): (required) A single rules[] entry.

Returns:
  (string) "true" when the rule redirects, empty otherwise.
*/ -}}
{{- define "mozcloud-gateway-lib.httpRoute.rule.isTerminal" -}}
{{- $terminal := "" -}}
{{- if and .redirect (not .rewrite) -}}
  {{- $terminal = "true" -}}
{{- end -}}
{{- range $filter := default (list) .filters -}}
  {{- if eq (default "" $filter.type) "RequestRedirect" -}}
    {{- $terminal = "true" -}}
  {{- end -}}
{{- end -}}
{{- $terminal -}}
{{- end -}}

{{- /*
Renders the matches block of a rule. Matches that carry neither a path nor
headers cannot be expressed, so they fall back to the catch-all prefix rather
than rendering an empty key.

Params:
  . (dict): (required) A single rules[] entry.

Returns:
  (string) The "matches:" block.
*/ -}}
{{- define "mozcloud-gateway-lib.httpRoute.rule.matches" -}}
{{- $matches := list -}}
{{- range $match := default (list) .matches -}}
  {{- if or $match.path $match.headers -}}
    {{- $matches = append $matches $match -}}
  {{- end -}}
{{- end -}}
matches:
  {{- range $match := $matches }}
  {{- if and $match.path $match.headers }}
  - path:
      type: {{ $match.path.type }}
      value: {{ $match.path.value }}
    headers:
      {{- range $header := $match.headers }}
      - name: {{ $header.name }}
        value: {{ $header.value }}
      {{- end }}
  {{- else if $match.path }}
  - path:
      type: {{ $match.path.type }}
      value: {{ $match.path.value }}
  {{- else }}
  - headers:
      {{- range $header := $match.headers }}
      - name: {{ $header.name }}
        value: {{ $header.value }}
      {{- end }}
  {{- end }}
  {{- end }}
  {{- if not $matches }}
  - path:
      type: PathPrefix
      value: /
  {{- end }}
{{- end -}}

{{- /*
Renders the filters block of a rule: the verbatim filters from values first,
then the library's own rewrite or redirect shorthand. Spelling out a filter the
shorthand also emits would render it twice, so that combination fails here
rather than at apply time.

Params:
  . (dict): (required) A single rules[] entry.

Returns:
  (string) The "filters:" block, or nothing when the rule has no filters.
*/ -}}
{{- define "mozcloud-gateway-lib.httpRoute.rule.filters" -}}
{{- range $filter := default (list) .filters -}}
  {{- if or (and $.rewrite (eq (default "" $filter.type) "URLRewrite")) (and $.redirect (eq (default "" $filter.type) "RequestRedirect")) -}}
    {{- fail (printf "httpRoute rules: a %s entry in filters conflicts with the rewrite/redirect shorthand; set one or the other." $filter.type) -}}
  {{- end -}}
{{- end -}}
{{- if or .filters .rewrite .redirect -}}
filters:
  {{- if .filters }}
  {{- toYaml .filters | nindent 2 }}
  {{- end }}
  {{- if .rewrite }}
  - type: URLRewrite
    urlRewrite:
      {{- if .rewrite.hostname }}
      hostname: {{ .rewrite.hostname | quote }}
      {{- end }}
      {{- if .rewrite.path }}
      path:
        type: {{ .rewrite.path.type }}
        {{- if eq .rewrite.path.type "ReplaceFullPath" }}
        replaceFullPath: {{ .rewrite.path.name }}
        {{- else if eq .rewrite.path.type "ReplacePrefixMatch" }}
        replacePrefixMatch: {{ .rewrite.path.name }}
        {{- end }}
      {{- end }}
  {{- else if .redirect }}
  - type: RequestRedirect
    requestRedirect:
      path:
        type: {{ .redirect.type }}
        {{- if eq .redirect.type "ReplaceFullPath" }}
        replaceFullPath: {{ .redirect.path }}
        {{- else if eq .redirect.type "ReplacePrefixMatch" }}
        replacePrefixMatch: {{ .redirect.path }}
        {{- end }}
        statusCode: {{ .redirect.statusCode }}
  {{- end }}
{{- end -}}
{{- end -}}

{{- define "mozcloud-gateway-lib.httpRoute" -}}
{{- $http_routes := include "mozcloud-gateway-lib.config.httpRoutes" . | fromYaml }}
{{- range $http_route := $http_routes.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $http_route.name }}
  labels:
    {{- $http_route.labels | toYaml | nindent 4 }}
spec:
  parentRefs:
    {{- range $gateway_ref := $http_route.gatewayRefs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway_ref.name }}
      {{- if $gateway_ref.namespace }}
      namespace: {{ $gateway_ref.namespace }}
      {{- end }}
      sectionName: {{ $gateway_ref.section }}
    {{- end }}
  {{- if $http_route.hostnames }}
  hostnames:
    {{- range $hostname := $http_route.hostnames }}
    - {{ $hostname | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $rule := $http_route.rules }}
    {{- if include "mozcloud-gateway-lib.httpRoute.rule.isTerminal" $rule }}
    - {{ include "mozcloud-gateway-lib.httpRoute.rule.filters" $rule | nindent 6 | trim }}
      {{- include "mozcloud-gateway-lib.httpRoute.rule.matches" $rule | nindent 6 }}
    {{- else }}
    - backendRefs:
      {{- range $backend_ref := $rule.backendRefs }}
        {{- if and $backend_ref.kind (eq $backend_ref.kind "ServiceImport") }}
        {{- $_ := set $backend_ref "group" "net.gke.io" }}
        {{- end }}
      - group: {{ default "" $backend_ref.group | quote }}
        kind: {{ default "Service" $backend_ref.kind }}
        name: {{ $backend_ref.name }}
        port: {{ $backend_ref.port }}
        {{- if kindIs "invalid" $backend_ref.weight }}
        weight: 1
        {{- else }}
        weight: {{ $backend_ref.weight }}
        {{- end }}
        {{- /* Rendered as the Gateway API specifies, on every provider.
               Support here is implementation-specific, and the spec points at
               rules[].filters[] (Core) for broader support. GKE is one of the
               implementations that refuse them — it reports GWCER104 and then
               stops programming the entire Gateway, not just this route. */}}
        {{- if $backend_ref.filters }}
        filters:
          {{- toYaml $backend_ref.filters | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- include "mozcloud-gateway-lib.httpRoute.rule.matches" $rule | nindent 6 }}
      {{- include "mozcloud-gateway-lib.httpRoute.rule.filters" $rule | nindent 6 }}
    {{- end }}
    {{- end }}
{{- /* Only the gateways that actually have an http listener get the redirect
       route. Cross-namespace/external gateways (e.g. a shared HTTPS-only
       gateway) are excluded via httpRedirect=false so we don't attach a route
       to a nonexistent http section. */ -}}
{{- $redirect_refs := list }}
{{- range $gateway_ref := $http_route.gatewayRefs }}
{{- if $gateway_ref.httpRedirect }}{{- $redirect_refs = append $redirect_refs $gateway_ref }}{{- end }}
{{- end }}
{{- if and $http_route.httpToHttpsRedirect $redirect_refs }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $http_route.name }}-http-redirect
  labels:
    {{- $http_route.labels | toYaml | nindent 4 }}
spec:
  parentRefs:
    {{- range $gateway_ref := $redirect_refs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway_ref.name }}
      {{- if $gateway_ref.namespace }}
      namespace: {{ $gateway_ref.namespace }}
      {{- end }}
      sectionName: http
    {{- end }}
  {{- if $http_route.hostnames }}
  hostnames:
    {{- range $hostname := $http_route.hostnames }}
    - {{ $hostname | quote }}
    {{- end }}
  {{- end }}
  rules:
    - filters:
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          statusCode: 302
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
{{- end -}}
