---
suite: "mozcloud-gateway: Basic configuration"
release:
  name: mozcloud-test
  namespace: mozcloud-test-dev
# By overriding the chart version, we are preventing the labels chart from
# updating the mozcloud_chart_version label for every snapshot every time we
# bump chart versions.
chart:
  version: 1.0.0
values:
  - values/globals.yaml
  - values/basic-configuration.yaml
tests:
  - it: Configuration matches entire snapshot
    asserts:
      - notFailedTemplate: {}
      - matchSnapshot: {}

  - it: Gateway, GCPGatewayPolicy, Service, GCPBackendPolicy, and HealthCheckPolicy are configured correctly
    asserts:
      # GCP backend policy is configured correctly
      - isSubset:
          path: spec.default
          content:
            logging:
              enabled: true
              sampleRate: 100000
        template: backendpolicy.yaml
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: test-service
      - equal:
          path: spec.targetRef.name
          value: test-service
        template: backendpolicy.yaml
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: test-service
      - notExists:
          path: spec.default.securityPolicy
        template: backendpolicy.yaml
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: test-service
      # External gateway is configured correctly
      - equal:
          path: metadata.annotations["networking.gke.io/certmap"]
          value: mozcloud-test-nonprod-dev
        template: gateway.yaml
        documentSelector:
          path: $[?(@.kind == "Gateway")].metadata.name
          value: test-gateway
      - isNotNullOrEmpty:
          path: spec.addresses
        template: gateway.yaml
        documentSelector:
          path: $[?(@.kind == "Gateway")].metadata.name
          value: test-gateway
      - contains:
          path: spec.listeners
          count: 1
          content:
            allowedRoutes:
              namespaces:
                from: Same
            name: http
            port: 80
            protocol: HTTP
        template: gateway.yaml
        documentSelector:
          path: $[?(@.kind == "Gateway")].metadata.name
          value: test-gateway
      - contains:
          path: spec.listeners
          count: 1
          content:
            allowedRoutes:
              namespaces:
                from: Same
            name: https
            port: 443
            protocol: HTTPS
        template: gateway.yaml
        documentSelector:
          path: $[?(@.kind == "Gateway")].metadata.name
          value: test-gateway
      - matchRegex:
          path: spec.gatewayClassName
          pattern: ^gke-l7-global-external-managed(-mc)?$
        template: gateway.yaml
        documentSelector:
          path: $[?(@.kind == "Gateway")].metadata.name
          value: test-gateway
      # Gateway policy is configured correctly
      - equal:
          path: spec.default.sslPolicy
          value: mozilla-intermediate
        template: gatewaypolicy.yaml
        documentSelector:
          path: $[?(@.kind == "GCPGatewayPolicy")].metadata.name
          value: test-gateway
      - isSubset:
          path: spec.targetRef
          content:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: test-gateway
        template: gatewaypolicy.yaml
        documentSelector:
          path: $[?(@.kind == "GCPGatewayPolicy")].metadata.name
          value: test-gateway
      # Healthcheck policy is configured correctly
      - equal:
          path: spec.default.config.httpHealthCheck.requestPath
          value: /__lbheartbeat__
        template: healthcheckpolicy.yaml
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: test-service
      - equal:
          path: spec.targetRef.name
          value: test-service
        template: healthcheckpolicy.yaml
        documentSelector:
          path: $[?(@.kind == "HealthCheckPolicy")].metadata.name
          value: test-service
      # Service is configured correctly
      - contains:
          path: spec.ports
          count: 1
          content:
            name: http
            port: 8080
            protocol: TCP
            targetPort: http
        template: service.yaml
        documentSelector:
          path: $[?(@.kind == "Service")].metadata.name
          value: test-service
      - exists:
          path: spec.selector
        template: service.yaml
        documentSelector:
          path: $[?(@.kind == "Service")].metadata.name
          value: test-service
      - isNotNullOrEmpty:
          path: spec.selector
        template: service.yaml
        documentSelector:
          path: $[?(@.kind == "Service")].metadata.name
          value: test-service
      - equal:
          path: spec.type
          value: ClusterIP
        template: service.yaml
        documentSelector:
          path: $[?(@.kind == "Service")].metadata.name
          value: test-service

  - it: HTTPS and HTTP-to-HTTPS redirect HTTPRoutes are configured correctly
    template: httproute.yaml
    asserts:
      # HTTPS HTTPRoute is configured correctly
      - contains:
          path: spec.parentRefs
          count: 1
          content:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: test-gateway
            sectionName: https
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - notContains:
          path: spec.parentRefs
          content:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: test-gateway
            sectionName: http
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - lengthEqual:
          path: spec.rules
          count: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - exists:
          path: spec.rules[0].backendRefs
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - contains:
          path: spec.rules[0].backendRefs
          count: 1
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - notExists:
          path: spec.rules[0].filters[0].requestRedirect
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      # HTTP-to-HTTPS redirect HTTPRoute is configured correctly
      - contains:
          path: spec.parentRefs
          count: 1
          content:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: test-gateway
            sectionName: http
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute-http-redirect
      - notContains:
          path: spec.parentRefs
          content:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: test-gateway
            sectionName: https
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute-http-redirect
      - lengthEqual:
          path: spec.rules
          count: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute-http-redirect
      - notExists:
          path: spec.rules[0].backendRefs
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute-http-redirect
      - contains:
          path: spec.rules[0].filters
          count: 1
          content:
            requestRedirect:
              scheme: https
              statusCode: 302
            type: RequestRedirect
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute-http-redirect
      - contains:
          path: spec.rules[0].matches
          count: 1
          content:
            path:
              type: PathPrefix
              value: /
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute-http-redirect

  # A redirect is terminal, so the rule never reaches a backend and carrying a
  # backendRef would be dead weight. A rewrite without a hostname must not
  # synthesise an empty one, and a match with neither a path nor headers is the
  # catch-all, not an empty matches list. A rule that sets both shorthands
  # renders the rewrite, so it is not terminal and keeps its backendRefs.
  - it: Redirect, path-only rewrite, empty match, and both shorthands render the right rule shapes
    template: httproute.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/httproute-rule-shapes.yaml
    asserts:
      - notExists:
          path: spec.rules[0].backendRefs
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - equal:
          path: spec.rules[0].filters[0].requestRedirect.path
          value:
            type: ReplacePrefixMatch
            replacePrefixMatch: /new
            statusCode: 301
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - notExists:
          path: spec.rules[1].filters[0].urlRewrite.hostname
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - equal:
          path: spec.rules[2].matches
          value:
            - path:
                type: PathPrefix
                value: /
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - equal:
          path: spec.rules[3].filters[0].type
          value: URLRewrite
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute
      - contains:
          path: spec.rules[3].backendRefs
          content:
            group: ""
            kind: Service
            name: test-service
            port: 8080
            weight: 1
        documentSelector:
          path: $[?(@.kind == "HTTPRoute")].metadata.name
          value: test-httproute

  # The shorthand already emits the filter, so spelling out the same type
  # renders it twice. The API server would reject that at apply time; failing
  # the render names the offending rule instead.
  - it: A filter that duplicates the rewrite shorthand fails the render
    template: httproute.yaml
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/httproute-filter-conflict.yaml
    asserts:
      - failedTemplate:
          errorPattern: "a URLRewrite entry in filters conflicts with the rewrite/redirect shorthand"

  # Helm decodes values through JSON, so every number arrives as a float64 and
  # Go renders anything from 1000000 up in scientific notation. The CRD field is
  # an integer, and YAML 1.1 parsers read "1e+06" as a string.
  - it: Logging sample rate renders as an integer at the documented maximum
    values:
      - values/globals.yaml
      - values/basic-configuration.yaml
      - values/backend-policy-logging-max-sample-rate.yaml
    asserts:
      - isSubset:
          path: spec.default
          content:
            logging:
              enabled: true
              sampleRate: 1000000
        template: backendpolicy.yaml
        documentSelector:
          path: $[?(@.kind == "GCPBackendPolicy")].metadata.name
          value: test-service
