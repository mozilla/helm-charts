{{- if and .Values.enabled (.Values.gateway).enabled }}
{{- $gateway_config := .Values.gateway }}
{{- /* Remove default key and merge with user-defined keys, if defined */}}
{{- if or
  (and (eq (keys .Values.gateway.gateways | len) 1) (ne (keys .Values.gateway.gateways | first) "default"))
  (gt (keys .Values.gateway.gateways | len) 1)
}}
  {{- $default := default (dict) (index .Values.gateway.gateways "default") }}
  {{- $gateways := dict }}
  {{- range $name, $config := omit .Values.gateway.gateways "default" }}
    {{- $_ := set $gateways $name (mergeOverwrite (deepCopy $default) $config) }}
  {{- end }}
  {{- $gateway_config = set (omit .Values.gateway "gateways") "gateways" $gateways }}
{{- end }}
{{- $params := dict "gatewayConfig" $gateway_config "gatewayPolicyConfig" .Values.gatewayPolicy "Chart" .Chart "Release" .Release }}
{{- if .Values.nameOverride }}
  {{- $_ := set $params "nameOverride" .Values.nameOverride }}
{{- end }}
{{- $label_params := include "mozcloud-gateway.labelParams" .  | fromYaml }}
{{ include "mozcloud-gateway-lib.gatewayPolicy" (mergeOverwrite $params $label_params) }}
{{- end }}
